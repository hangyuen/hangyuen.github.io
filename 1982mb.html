<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>1982 Mercedes-Benz 190E</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #111;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  model-viewer {
    width: 100%;
    height: 100vh;
    background-color: #1a1a1a;
    --poster-color: #1a1a1a;
  }
  .title {
    position: absolute;
    top: 16px;
    left: 20px;
    color: #eee;
    font-size: 15px;
    letter-spacing: 0.5px;
    opacity: 0.85;
    z-index: 10;
    pointer-events: none;
  }
  .hint {
    position: absolute;
    bottom: 14px;
    left: 20px;
    color: #aaa;
    font-size: 12px;
    z-index: 10;
    pointer-events: none;
  }
</style>
</head>
<body>

  <div class="title">1982 Mercedes-Benz 190E</div>
  <div class="hint">Drag to rotate &middot; Scroll to zoom</div>

  <model-viewer
    src="assets/1982.glb"
    alt="3D model of a Mercedes-Benz 190E"
    camera-controls
    auto-rotate
    auto-rotate-delay="0"
    rotation-per-second="18deg"
    shadow-intensity="1"
    exposure="1"
    environment-image="neutral"
    camera-orbit="35deg 70deg 105%"
    interaction-prompt="none"
    loading="eager">
  </model-viewer>

</body>
</html>
