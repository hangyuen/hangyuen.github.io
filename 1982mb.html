<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>1982 Mercedes-Benz 190E</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script type="module" src="model-viewer.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * {
    box-sizing: border-box;
  }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    height: 100dvh;
    background: #000000;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  model-viewer {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    background: radial-gradient(ellipse at 50% 45%, #1c1c1e 0%, #000000 72%);
    --poster-color: #000000;
    opacity: 0;
    animation: reveal 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
  }

  @keyframes reveal {
    from { opacity: 0; transform: scale(1.015); }
    to   { opacity: 1; transform: scale(1); }
  }

  .back-link {
    text-decoration: none;
    position: fixed;
    top: 22px;
    left: var(--page-gutter, 24px);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 15px;
    font-weight: 500;
    color: rgba(255,255,255,0.6);
    padding: 4px 0;
    z-index: 11;
    transition: color 0.15s ease, gap 0.15s ease;
  }
  .back-link:hover {
    color: #0071e3;
    gap: 9px;
  }
  .back-link svg {
    width: 15px;
    height: 15px;
  }

  .topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    padding-top: 58px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    z-index: 10;
    pointer-events: none;
    background: linear-gradient(to bottom, rgba(0,0,0,0.55), rgba(0,0,0,0) 90px);
  }

  .heading {
    text-align: center;
    opacity: 0;
    animation: fadeDown 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Matches .project-content h1 on index.html/digital-arts.html exactly:
     same size, weight, and letter-spacing as the Howl's Moving Castle
     project window title. */
  .model-name {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    font-size: 38px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: rgba(255,255,255,0.92);
  }

  .model-name .year {
    font-weight: 500;
    color: rgba(255,255,255,0.5);
    margin-right: 10px;
  }

  .info-panel {
    max-width: 360px;
    text-align: left;
  }

  .info-meta {
    font-size: 14px;
    letter-spacing: -0.006em;
    color: rgba(255,255,255,0.5);
    margin-bottom: 8px;
  }

  .info-description {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    letter-spacing: -0.005em;
    color: rgba(255,255,255,0.72);
  }

  .bottom-cluster {
    position: fixed;
    bottom: calc(26px + env(safe-area-inset-bottom, 0px));
    left: var(--page-gutter, 24px);
    right: 16px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
    z-index: 10;
    opacity: 0;
    animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translate(0, 8px); }
    to   { opacity: 1; transform: translate(0, 0); }
  }

  /* Shared glass-pill base — .swatches and .hint both use this exact
     block so they render as a matched set (same height, padding, blur,
     border, shadow). Only gap/content differ. */
  .swatches,
  .hint {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 14px;
    border-radius: 980px;
    position: relative;
    background: linear-gradient(155deg, rgba(255,255,255,0.20) 0%, rgba(255,255,255,0.06) 45%, rgba(255,255,255,0.10) 100%);
    backdrop-filter: blur(24px) saturate(200%) brightness(1.1);
    -webkit-backdrop-filter: blur(24px) saturate(200%) brightness(1.1);
    border: 0.5px solid rgba(255,255,255,0.22);
    box-shadow:
      inset 0 1px 1px rgba(255,255,255,0.45),
      inset 0 -1px 2px rgba(0,0,0,0.18),
      0 10px 30px rgba(0,0,0,0.35),
      0 0 24px rgba(255,255,255,0.05);
    overflow: hidden;
  }

  .hint {
    color: rgba(255,255,255,0.8);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: -0.005em;
    pointer-events: none;
  }

  .swatches::before,
  .hint::before {
    content: "";
    position: absolute;
    top: -60%;
    left: -10%;
    width: 28%;
    height: 140%;
    background: radial-gradient(ellipse at center, rgba(255,255,255,0.16), rgba(255,255,255,0) 70%);
    pointer-events: none;
    z-index: 0;
  }

  .swatches::after,
  .hint::after {
    content: "";
    position: absolute;
    bottom: -80%;
    right: -15%;
    width: 34%;
    height: 155%;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.24), rgba(0,0,0,0) 70%);
    pointer-events: none;
    z-index: 0;
  }

  .swatch {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: none;
    padding: 0;
    cursor: pointer;
    position: relative;
    z-index: 1;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.5), inset 0 0 0 0.5px rgba(255,255,255,0.25);
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .swatch:hover {
    transform: scale(1.12);
  }

  .swatch.selected::after {
    content: "";
    position: absolute;
    top: -4px;
    left: -4px;
    right: -4px;
    bottom: -4px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.9);
  }

  @media (max-width: 480px) {
    .back-link { left: 16px; top: 16px; }
    .bottom-cluster { left: 16px; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
    .info-panel { max-width: 100%; }
    .info-description { font-size: 14px; }
    .swatch { width: 20px; height: 20px; }
    .swatches, .hint { padding: 9px 14px; }
    .hint { font-size: 13px; }
    .model-name { font-size: 28px; }
    .topbar { padding-top: 48px; }
  }
</style>
</head>
<body>

  <a class="back-link" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Back
  </a>

  <div class="topbar">
    <div class="heading">
      <div class="model-name"><span class="year">1982</span>Mercedes-Benz 190E</div>
    </div>
  </div>

  <div class="bottom-cluster">
    <div class="info-panel">
      <div class="info-meta">Computer Modeling &middot; Blender &middot; 2024</div>
      <p class="info-description">A classic Mercedes-Benz 190E, rebuilt for the web: materials, lighting, and paint were reworked in Blender, then brought into an interactive glTF viewer where the color can be swapped live.</p>
    </div>
    <div class="swatches" id="swatches">
      <button class="swatch selected" style="background:#7a1414" data-color="0.42,0.045,0.05,1" aria-label="Signal red"></button>
      <button class="swatch" style="background:#d8a73c" data-color="0.82,0.62,0.18,1" aria-label="Sun yellow"></button>
      <button class="swatch" style="background:#4c5a34" data-color="0.28,0.35,0.19,1" aria-label="Cactus green"></button>
      <button class="swatch" style="background:#1c3350" data-color="0.08,0.16,0.28,1" aria-label="Lapis blue"></button>
      <button class="swatch" style="background:#a6adb3" data-color="0.55,0.57,0.60,1" aria-label="Silver blue"></button>
      <button class="swatch" style="background:#0a0a0a" data-color="0.02,0.02,0.02,1" aria-label="Black"></button>
    </div>
    <div class="hint">
      Drag to rotate &middot; Scroll to zoom
    </div>
  </div>

  <model-viewer
    id="car"
    src="assets/1982.glb"
    alt="3D model of a Mercedes-Benz 190E"
    camera-controls
    auto-rotate
    auto-rotate-delay="0"
    rotation-per-second="8deg"
    shadow-intensity="1"
    exposure="1"
    environment-image="https://modelviewer.dev/shared-assets/environments/spruit_sunrise_1k_HDR.hdr"
    tone-mapping="neutral"
    camera-orbit="35deg 70deg 105%"
    interaction-prompt="none"
    loading="eager">
  </model-viewer>

  <script>
    const viewer = document.getElementById('car');
    const swatchesEl = document.getElementById('swatches');

    // Old-fashioned single-stage lacquer look: matte-ish, low metallic,
    // instead of a modern glossy clearcoat finish. Applied every time a
    // color is selected, on top of the chosen base color.
    const VINTAGE_ROUGHNESS = 0.5;
    const VINTAGE_METALNESS = 0.12;

    function applyColor(rgba) {
      if (!viewer.model) return;
      const materials = viewer.model.materials;
      for (const mat of materials) {
        if (mat.name === 'EXT_Car_Paint' || mat.name === 'ENG_Car_Paint') {
          mat.pbrMetallicRoughness.setBaseColorFactor(rgba);
          mat.pbrMetallicRoughness.setRoughnessFactor(VINTAGE_ROUGHNESS);
          mat.pbrMetallicRoughness.setMetallicFactor(VINTAGE_METALNESS);
        }
      }
    }

    swatchesEl.addEventListener('click', (e) => {
      const btn = e.target.closest('.swatch');
      if (!btn) return;
      const rgba = btn.dataset.color.split(',').map(Number);
      applyColor(rgba);
      swatchesEl.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
      btn.classList.add('selected');
    });

    viewer.addEventListener('load', () => {
      const initial = swatchesEl.querySelector('.swatch.selected');
      const rgba = initial.dataset.color.split(',').map(Number);
      applyColor(rgba);
    });
  </script>

</body>
</html>
