<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="format-detection" content="address=no, telephone=no, email=no, date=no">
<title>Digital Arts · Hang Yuan's Web</title>
<link rel="icon" type="image/png" href="assets/hy.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #ffffff;
    --ink: #1d1d1f;
    --dim: #6e6e73;
    --accent: #0071e3;
    --hairline: rgba(0,0,0,0.08);
    --page-gutter: clamp(40px, 9vw, 123px);
    /* fixed height for the text block under each frame, so a card with a
       long description and a card with none still line up along the same
       baseline in the row */
    --caption-height: 190px;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html, body{ height:100%; }

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    padding-bottom:clamp(24px, 4vh, 60px);
  }

  a{ color:inherit; text-decoration:none; }

  :focus-visible{
    outline:2px solid var(--accent);
    outline-offset:3px;
    border-radius:4px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition-duration:0.01ms !important; scroll-behavior:auto !important; animation-duration:0.01ms !important; animation-iteration-count:1 !important; }
  }

  @keyframes arrowAttention{
    0%, 100% { box-shadow:0 4px 24px rgba(0,0,0,0.12), 0 0 0 0 rgba(0,113,227,0); }
    50% { box-shadow:0 4px 24px rgba(0,0,0,0.12), 0 0 0 8px rgba(0,113,227,0.16); }
  }

  /* PAGE HEADER — back link, title, short intro, all left-aligned with the
     carousel below */
  .page-header{
    max-width:2400px;
    margin:0 auto;
    padding:56px var(--page-gutter) 0;
  }
  .back-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:16px;
    font-weight:500;
    color:var(--dim);
    padding:4px 0;
    transition:color 0.15s ease, gap 0.15s ease;
    margin-bottom:40px;
  }
  .back-link:hover{
    color:var(--accent);
    gap:9px;
  }
  .back-link svg{ width:16px; height:16px; }

  .page-title{
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    font-size:clamp(34px, 5vw, 56px);
    font-weight:700;
    letter-spacing:-0.02em;
    color:#111111;
    margin-bottom:14px;
  }
  .page-description{
    font-size:17px;
    line-height:1.55;
    color:var(--dim);
    letter-spacing:-0.011em;
    margin-bottom:56px;
  }

  /* CAROUSEL — horizontal scroll, snap-to-item, round arrow buttons like
     the reference. Captions sit under each image at all times, no hover. */
  .carousel-wrap{
    position:relative;
    max-width:2400px;
    margin:0 auto;
    padding-bottom:12px;
  }

  .carousel-track{
    display:flex;
    gap:40px;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    scroll-behavior:smooth;
    scroll-padding-inline:var(--page-gutter);
    -webkit-overflow-scrolling:touch;
    padding:0 var(--page-gutter);
    scrollbar-width:none;
    -ms-overflow-style:none;
  }
  .carousel-track::-webkit-scrollbar{ display:none; }

  .art-item{
    /* grows with the viewport directly (not tied to any page-wide zoom),
       so the artwork gets more physical presence on a big screen while
       type sizes below stay exactly as authored. Capped at 860px so it
       doesn't get absurd on a 5K/6K monitor. */
    flex:0 0 clamp(300px, 36vw, 860px);
    scroll-snap-align:start;
  }

  .art-frame{
    position:relative;
    width:100%;
    aspect-ratio:3/2;
    overflow:hidden;
    border-radius:18px;
    background-color:#f0f0f0;
    transition:transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .art-frame img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .art-item:hover .art-frame{
    transform:scale(1.012);
  }

  /* video facade — a static thumbnail with a play button; the real
     iframe is only injected once the person clicks, so an embedded
     player never loads (or autoplays a network request) before that */
  .video-facade{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:0;
    cursor:pointer;
    background:#111;
  }
  .video-facade img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    transition:opacity 0.2s ease;
  }
  .video-facade:hover img{
    opacity:0.85;
  }
  .art-video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:0;
  }

  .art-caption{
    padding-top:14px;
    min-height:var(--caption-height);
    display:flex;
    flex-direction:column;
  }
  .art-title{
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    font-size:19px;
    font-weight:700;
    letter-spacing:-0.02em;
    color:#111111;
    margin-bottom:4px;
  }
  .art-meta{
    font-size:13px;
    letter-spacing:-0.006em;
    color:var(--dim);
  }
  .art-description{
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    font-size:14.5px;
    line-height:1.65;
    color:#4a4a4a;
    letter-spacing:-0.005em;
    margin-top:14px;
    /* clamp to a fixed number of lines so a long description and a short
       one both take up the same space in the row; the rest is reachable
       by opening the piece on its own, not truncated silently forever */
    display:-webkit-box;
    -webkit-line-clamp:4;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }
  .art-exhibition{
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    font-size:13px;
    font-style:italic;
    line-height:1.5;
    color:var(--dim);
    margin-top:auto;
    padding-top:10px;
  }

  /* round nav arrows — glassy, inset ON TOP of the image content at each
     end of the row, echoing the translucent controls on apple.com */
  .carousel-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:44px;
    height:44px;
    border-radius:50%;
    background:rgba(255,255,255,0.7);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border:1px solid rgba(0,0,0,0.06);
    box-shadow:0 4px 24px rgba(0,0,0,0.12);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:5;
    transition:background 0.2s ease, opacity 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    animation:arrowAttention 2.2s ease-in-out 3;
  }
  .carousel-arrow:hover{
    background:rgba(255,255,255,0.95);
    border-color:rgba(0,113,227,0.4);
    transform:translateY(-50%) scale(1.08);
    box-shadow:0 6px 28px rgba(0,0,0,0.16), 0 0 0 5px rgba(0,113,227,0.14);
  }
  .carousel-arrow:hover svg{
    color:var(--accent);
    transition:color 0.2s ease, transform 0.2s ease;
  }
  .carousel-arrow.prev:hover svg{ transform:translateX(-2px); }
  .carousel-arrow.next:hover svg{ transform:translateX(2px); }
  .carousel-arrow.prev{ left:calc(var(--page-gutter) + 20px); }
  .carousel-arrow.next{ right:calc(var(--page-gutter) + 20px); }
  .carousel-arrow svg{ width:17px; height:17px; color:#1d1d1f; }
  .carousel-arrow[disabled]{
    opacity:0;
    pointer-events:none;
  }

  /* progress dots — the only position indicator on touch devices (arrows
     are hidden below 900px), but shown everywhere since they're cheap
     and useful on desktop too */
  .carousel-dots{
    display:flex;
    justify-content:center;
    gap:8px;
    padding-top:12px;
  }
  .carousel-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:rgba(0,0,0,0.16);
    border:0;
    padding:0;
    cursor:pointer;
    transition:background 0.2s ease, transform 0.2s ease;
  }
  .carousel-dot:hover{ background:rgba(0,0,0,0.32); }
  .carousel-dot.active{
    background:var(--accent);
    transform:scale(1.25);
  }

  @media (max-width:900px){
    .art-item{ flex:0 0 78vw; max-width:none; }
    .carousel-arrow{ display:none; }
  }
  @media (max-width:560px){
    .art-item{ flex:0 0 88vw; }
    :root{ --caption-height: 210px; }
  }

  /* ZOOM TRIGGER — a soft round button centered over image artworks
     (not videos) that reveals on hover/focus/touch, echoing the
     magnifier-with-plus affordance from product image galleries */
  .zoom-trigger{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%) scale(0.9);
    width:56px;
    height:56px;
    border-radius:50%;
    background:rgba(255,255,255,0.85);
    backdrop-filter:blur(16px) saturate(180%);
    -webkit-backdrop-filter:blur(16px) saturate(180%);
    border:1px solid rgba(0,0,0,0.06);
    box-shadow:0 4px 20px rgba(0,0,0,0.14);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:zoom-in;
    z-index:4;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.2s ease, transform 0.2s ease, background 0.2s ease;
  }
  .zoom-trigger svg{ width:22px; height:22px; color:#1d1d1f; transition:color 0.2s ease; }
  .art-frame:hover .zoom-trigger,
  .art-frame:focus-within .zoom-trigger{
    opacity:1;
    pointer-events:auto;
    transform:translate(-50%, -50%) scale(1);
  }
  .zoom-trigger:hover{
    background:rgba(255,255,255,0.98);
  }
  .zoom-trigger:hover svg{ color:var(--accent); }
  /* always show on touch devices, since there's no hover to reveal it */
  @media (hover:none){
    .zoom-trigger{ opacity:1; pointer-events:auto; transform:translate(-50%, -50%) scale(1); }
  }

  /* ZOOM LIGHTBOX — full artwork with +/- controls to scale in and out */
  .lightbox{
    position:fixed;
    inset:0;
    background:rgba(20,20,22,0.92);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease;
  }
  .lightbox.open{ opacity:1; pointer-events:auto; }
  .lightbox-stage{
    position:relative;
    width:90vw;
    height:86vh;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    touch-action:none;
  }
  .lightbox-stage img{
    max-width:90vw;
    max-height:86vh;
    width:auto;
    height:auto;
    user-select:none;
    -webkit-user-drag:none;
    transition:transform 0.15s ease;
    will-change:transform;
  }
  .lightbox-stage.dragging img{ transition:none; cursor:grabbing; }
  .lightbox-close{
    position:absolute;
    top:24px;
    right:24px;
    width:44px;
    height:44px;
    border-radius:50%;
    background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.18);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:background 0.2s ease;
  }
  .lightbox-close:hover{ background:rgba(255,255,255,0.2); }
  .lightbox-close svg{ width:18px; height:18px; }
  .lightbox-controls{
    position:absolute;
    bottom:28px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    gap:2px;
    background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.16);
    border-radius:999px;
    padding:6px;
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
  }
  .lightbox-btn{
    width:40px;
    height:40px;
    border-radius:50%;
    background:transparent;
    border:0;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:19px;
    line-height:1;
    transition:background 0.2s ease, opacity 0.2s ease;
  }
  .lightbox-btn:hover{ background:rgba(255,255,255,0.16); }
  .lightbox-btn:disabled{ opacity:0.35; cursor:default; pointer-events:none; }
  .lightbox-btn svg{ width:18px; height:18px; }
  .lightbox-zoom-label{
    min-width:46px;
    text-align:center;
    color:rgba(255,255,255,0.85);
    font-size:13px;
    font-variant-numeric:tabular-nums;
  }
</style>
</head>
<body>

<div class="page-header">
  <a class="back-link" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Back
  </a>
  <h1 class="page-title">Digital Arts</h1>
  <p class="page-description">A collection of digital painting, illustration, motion graphics, social media, and architectural work. Swipe through to explore.</p>
</div>

<div class="carousel-wrap">
  <button type="button" class="carousel-arrow prev" id="prevBtn" aria-label="Previous">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="carousel-track" id="track"></div>
  <button type="button" class="carousel-arrow next" id="nextBtn" aria-label="Next">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
  </button>
</div>
<div class="carousel-dots" id="dots"></div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Zoomed artwork">
  <div class="lightbox-stage" id="lightboxStage">
    <img id="lightboxImg" src="" alt="">
  </div>
  <button type="button" class="lightbox-close" id="lightboxClose" aria-label="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
  </button>
  <div class="lightbox-controls">
    <button type="button" class="lightbox-btn" id="zoomOutBtn" aria-label="Zoom out">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M8 11h6"/></svg>
    </button>
    <span class="lightbox-zoom-label" id="zoomLabel">100%</span>
    <button type="button" class="lightbox-btn" id="zoomInBtn" aria-label="Zoom in">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M11 8v6M8 11h6"/></svg>
    </button>
  </div>
</div>

<script>
  // Replace this with your real pieces: image path, title, medium, year.
  // `description` is optional but if you add one for some pieces, keep it
  // short (2-3 sentences) for every piece — the clamp keeps the card
  // height fixed, but a piece with no description at all still leaves a
  // visibly empty gap next to ones that have one.
  const artworks = [
    { image: 'assets/Open Field, Open Love.jpg', title: 'Open Field, Open Love', medium: 'Digital Painting', year: '2026', aspect: '16/9', dimensions: '32 x 18 inches',
      description: "A figure stands alone in a windswept field, arms thrown open toward a golden retriever running to meet them. The grass bends and blurs around both figures, caught mid-motion, as if the whole landscape is moving with them. Open Field, Open Love speaks to the quiet work of reaching outward after isolation: the vulnerability of opening your arms before you know if anyone will meet you there, and the relief when something does.",
      exhibition: "Exhibited in Loneliness, Isolation and Connection, Ludington Area Center for the Arts, Ludington, MI, 2025." },
    { image: 'assets/Upstream.jpg', title: 'Upstream', medium: 'Digital Painting', year: '2024', aspect: '16/9', dimensions: '32 x 18 inches',
      description: "A figure sits chest-deep in a rushing current, calmly reading, anchored against the pull of the water by the quiet act of attention. Around them, the riverbank has burst into a wild tangle of wildflowers: lavender, goldenrod, poppies, and loosestrife crowding the frame in full bloom. Upstream holds two kinds of resistance at once: the physical push of the current, and the mental stillness required to stay present within it. Blooming, here, isn't passive. It happens even as things move against you.",
      exhibition: "Exhibited in Bloom, Mainframe Studios, Des Moines, IA, 2024." },
    { title: 'JoinJade', medium: 'Digital Motion Graphics', year: '2021', aspect: '16/9', video: '4YP7FZZNVCo', dimensions: '1920 x 1080 px',
      description: "Produced for JoinJade, a global public health campaign founded in 2001 by the Asian Liver Center at Stanford University to fight the stigma, transmission, and mortality linked to hepatitis B and liver cancer. This motion graphics piece opened the 2021 World Hepatitis Day event (July 28) at Stanford.",
      exhibition: "Exhibited at the Asian Liver Center, Stanford University, Palo Alto, CA, 2021." },
    { image: 'assets/Digital_Art.png', title: 'Untitled Piece 03', medium: 'Mixed media / digital', year: '2026' },
    { image: 'assets/Digital_Art.png', title: 'Untitled Piece 04', medium: 'Digital painting', year: '2025' },
    { image: 'assets/Digital_Art.png', title: 'Untitled Piece 05', medium: 'Digital illustration', year: '2025' },
    { image: 'assets/Digital_Art.png', title: 'Untitled Piece 06', medium: 'Digital painting', year: '2025' }
  ];

  const track = document.getElementById('track');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const dotsWrap = document.getElementById('dots');

  track.innerHTML = artworks.map((art, i) => `
    <div class="art-item">
      ${art.video
        ? `<div class="art-frame"${art.aspect ? ` style="aspect-ratio:${art.aspect};"` : ''}>
             <button type="button" class="video-facade" data-video="${art.video}" data-title="${art.title}" aria-label="Play ${art.title}">
               <img src="https://img.youtube.com/vi/${art.video}/hqdefault.jpg" alt="" loading="lazy">
             </button>
           </div>`
        : `<div class="art-frame"${art.aspect ? ` style="aspect-ratio:${art.aspect};"` : ''}>
             <img src="${art.image}" alt="${art.title}" loading="${i < 2 ? 'eager' : 'lazy'}">
             <button type="button" class="zoom-trigger" data-image="${art.image}" data-title="${art.title}" aria-label="Zoom into ${art.title}">
               <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M11 8v6M8 11h6"/></svg>
             </button>
           </div>`}
      <div class="art-caption">
        <div class="art-title">${art.title}</div>
        <div class="art-meta">${[art.medium, art.dimensions, art.year].filter(Boolean).join(', ')}</div>
        ${art.description ? `<p class="art-description">${art.description}</p>` : ''}
        ${art.exhibition ? `<p class="art-exhibition">${art.exhibition}</p>` : ''}
      </div>
    </div>
  `).join('');

  // swap the video facade for a real iframe only on click, so nothing
  // from YouTube loads until the person actually wants to watch it
  track.querySelectorAll('.video-facade').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.video;
      const title = btn.dataset.title;
      const iframe = document.createElement('iframe');
      iframe.className = 'art-video';
      iframe.src = `https://www.youtube.com/embed/${id}?autoplay=1`;
      iframe.title = title;
      iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
      iframe.allowFullscreen = true;
      btn.replaceWith(iframe);
    });
  });

  function itemStep(){
    const item = track.querySelector('.art-item');
    if (!item) return 0;
    const gap = parseFloat(getComputedStyle(track).gap) || 0;
    return item.offsetWidth + gap;
  }

  // vertically center the arrow buttons against the actual rendered
  // image height.
  function positionArrows(){
    const frame = track.querySelector('.art-frame');
    if (!frame) return;
    const top = frame.offsetTop + frame.offsetHeight / 2;
    prevBtn.style.top = top + 'px';
    nextBtn.style.top = top + 'px';
  }
  positionArrows();
  window.addEventListener('resize', positionArrows);

  prevBtn.addEventListener('click', () => {
    track.scrollBy({ left: -itemStep(), behavior: 'smooth' });
  });
  nextBtn.addEventListener('click', () => {
    track.scrollBy({ left: itemStep(), behavior: 'smooth' });
  });

  // dots — one per artwork, click to jump, active state follows scroll
  dotsWrap.innerHTML = artworks.map((_, i) =>
    `<button type="button" class="carousel-dot" data-index="${i}" aria-label="Go to piece ${i + 1}"></button>`
  ).join('');
  const dots = Array.from(dotsWrap.children);
  dots.forEach(dot => {
    dot.addEventListener('click', () => {
      const i = Number(dot.dataset.index);
      track.scrollTo({ left: i * itemStep(), behavior: 'smooth' });
    });
  });

  function updateDots(){
    const step = itemStep();
    if (!step) return;
    const active = Math.round(track.scrollLeft / step);
    dots.forEach((dot, i) => dot.classList.toggle('active', i === active));
  }

  // hide the prev/next arrow when there's nothing left to scroll to on that side
  function updateArrowState(){
    const maxScroll = track.scrollWidth - track.clientWidth - 1;
    prevBtn.disabled = track.scrollLeft <= 0;
    nextBtn.disabled = track.scrollLeft >= maxScroll;
  }
  track.addEventListener('scroll', () => {
    updateArrowState();
    updateDots();
  });
  window.addEventListener('resize', () => {
    updateArrowState();
    updateDots();
  });
  updateArrowState();
  updateDots();

  // ---- zoom lightbox ----
  const lightbox = document.getElementById('lightbox');
  const lightboxStage = document.getElementById('lightboxStage');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxClose = document.getElementById('lightboxClose');
  const zoomInBtn = document.getElementById('zoomInBtn');
  const zoomOutBtn = document.getElementById('zoomOutBtn');
  const zoomLabel = document.getElementById('zoomLabel');

  const ZOOM_MIN = 1;
  const ZOOM_MAX = 3;
  const ZOOM_STEP = 0.5;
  let zoom = 1;
  let panX = 0, panY = 0;
  let dragging = false, dragStartX = 0, dragStartY = 0, panStartX = 0, panStartY = 0;

  function applyZoom(){
    lightboxImg.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
    zoomLabel.textContent = Math.round(zoom * 100) + '%';
    zoomOutBtn.disabled = zoom <= ZOOM_MIN;
    zoomInBtn.disabled = zoom >= ZOOM_MAX;
    lightboxStage.style.cursor = zoom > 1 ? 'grab' : 'default';
  }

  function openLightbox(src, title){
    lightboxImg.src = src;
    lightboxImg.alt = title || '';
    zoom = 1; panX = 0; panY = 0;
    applyZoom();
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox(){
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
  }

  track.querySelectorAll('.zoom-trigger').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      openLightbox(btn.dataset.image, btn.dataset.title);
    });
  });

  zoomInBtn.addEventListener('click', () => {
    zoom = Math.min(ZOOM_MAX, zoom + ZOOM_STEP);
    if (zoom === ZOOM_MIN){ panX = 0; panY = 0; }
    applyZoom();
  });
  zoomOutBtn.addEventListener('click', () => {
    zoom = Math.max(ZOOM_MIN, zoom - ZOOM_STEP);
    if (zoom === ZOOM_MIN){ panX = 0; panY = 0; }
    applyZoom();
  });
  lightboxClose.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
  });
  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === '+' || e.key === '=') zoomInBtn.click();
    if (e.key === '-') zoomOutBtn.click();
  });

  // drag to pan once zoomed in
  lightboxStage.addEventListener('mousedown', (e) => {
    if (zoom <= ZOOM_MIN) return;
    dragging = true;
    lightboxStage.classList.add('dragging');
    dragStartX = e.clientX; dragStartY = e.clientY;
    panStartX = panX; panStartY = panY;
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    panX = panStartX + (e.clientX - dragStartX);
    panY = panStartY + (e.clientY - dragStartY);
    lightboxImg.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
  });
  window.addEventListener('mouseup', () => {
    dragging = false;
    lightboxStage.classList.remove('dragging');
  });

  // pinch/scroll to zoom on trackpads and mouse wheels
  lightboxStage.addEventListener('wheel', (e) => {
    e.preventDefault();
    const delta = e.deltaY < 0 ? ZOOM_STEP : -ZOOM_STEP;
    zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, zoom + delta * 0.5));
    if (zoom === ZOOM_MIN){ panX = 0; panY = 0; }
    applyZoom();
  }, { passive:false });
</script>

</body>
</html>
