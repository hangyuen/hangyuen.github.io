<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Arts — Hang Yuan's Web</title>
<link rel="icon" type="image/png" href="assets/hy.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #000000;
    --white: #ffffff;
    --dim: #b7b7b7;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html, body{ height:100%; }

  body{
    background:var(--bg);
    color:var(--white);
    font-family:'Inter', sans-serif;
  }

  a{ color:inherit; text-decoration:none; }

  /* TOP BAR — back link + page title, mirrors the dock's frosted-glass look */
  .topbar{
    position:sticky;
    top:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    padding:20px 32px;
    background:rgba(0,0,0,0.72);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .back-link{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:14px;
    font-weight:500;
    color:var(--white);
    padding:9px 16px 9px 12px;
    border-radius:999px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.14);
    transition:background 0.15s ease, transform 0.15s ease;
  }
  .back-link:hover{
    background:rgba(255,255,255,0.16);
    transform:translateY(-1px);
  }
  .back-link svg{ width:16px; height:16px; }

  .page-title{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--dim);
  }

  /* GALLERY GRID — 3 across on top, 3 across on bottom */
  .gallery{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:1px;
    background:rgba(255,255,255,0.08);
  }

  .art-box{
    position:relative;
    background:#000;
    display:flex;
    flex-direction:column;
  }

  .art-frame{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    overflow:hidden;
    background:#0c0c0c;
  }

  .art-frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:transform 0.5s ease;
  }
  .art-box:hover .art-frame img{
    transform:scale(1.04);
  }

  /* hover-reveal description overlay */
  .art-overlay{
    position:absolute;
    inset:0;
    display:flex;
    align-items:flex-end;
    padding:28px;
    background:linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.55) 45%, rgba(0,0,0,0) 100%);
    opacity:0;
    transition:opacity 0.3s ease;
  }
  .art-box:hover .art-overlay,
  .art-box:focus-within .art-overlay{
    opacity:1;
  }
  .art-overlay p{
    font-size:14px;
    line-height:1.6;
    color:#e8e8e8;
    max-width:46ch;
  }

  /* caption strip below each image: title / medium / year */
  .art-caption{
    padding:16px 20px 20px;
    border-top:1px solid rgba(255,255,255,0.08);
  }
  .art-title{
    font-size:15px;
    font-weight:600;
    letter-spacing:-0.01em;
    color:var(--white);
    margin-bottom:6px;
  }
  .art-meta{
    display:flex;
    flex-wrap:wrap;
    gap:6px 10px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.03em;
    color:var(--dim);
    text-transform:uppercase;
  }
  .art-meta span:not(:last-child)::after{
    content:'·';
    margin-left:10px;
    color:rgba(255,255,255,0.25);
  }

  @media (max-width:900px){
    .gallery{ grid-template-columns:repeat(2, 1fr); }
  }
  @media (max-width:560px){
    .gallery{ grid-template-columns:1fr; }
    .topbar{ padding:16px 20px; }
    .art-overlay{ padding:20px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <a class="back-link" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Back
  </a>
  <span class="page-title">Digital Arts</span>
</div>

<div class="gallery" id="gallery"></div>

</script>

</body>
</html>
