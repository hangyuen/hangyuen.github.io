<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Arts — Hang Yuan's Web</title>
<link rel="icon" type="image/png" href="assets/hy.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #000000;
    --white: #ffffff;
    --dim: #b7b7b7;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html, body{ height:100%; }

  body{
    background:var(--bg);
    color:var(--white);
    font-family:'Inter', sans-serif;
  }

  a{ color:inherit; text-decoration:none; }

  /* shared horizontal rhythm for the header and the grid below it, so the
     title, description, and first tile all line up on the same left edge.
     clamp() gives real breathing room on wide monitors without the content
     ever crowding the edges on small screens. */
  :root{
    --page-gutter: clamp(24px, 6vw, 120px);
  }

  /* PAGE HEADER — back link, then the big title, then a short intro,
     all left-aligned and stacked, sitting in normal page flow (not a bar) */
  .page-header{
    max-width:1600px;
    margin:0 auto;
    padding:48px var(--page-gutter) 0;
  }
  .back-link{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:14px;
    font-weight:500;
    color:var(--white);
    padding:9px 16px 9px 12px;
    border-radius:999px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.14);
    transition:background 0.15s ease, transform 0.15s ease;
    margin-bottom:32px;
  }
  .back-link:hover{
    background:rgba(255,255,255,0.16);
    transform:translateY(-1px);
  }
  .back-link svg{ width:16px; height:16px; }

  .page-title{
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    font-size:clamp(32px, 5vw, 52px);
    font-weight:700;
    letter-spacing:-0.02em;
    color:var(--white);
    margin-bottom:16px;
  }
  .page-description{
    max-width:640px;
    font-size:15px;
    line-height:1.6;
    color:var(--dim);
  }

  /* GALLERY GRID — 3 across, 2 down, with real breathing room between tiles
     (gutters + outer page margin) rather than edge-to-edge or hairlines. */
  .gallery{
    max-width:1600px;
    margin:0 auto;
    padding:48px var(--page-gutter) 96px;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    column-gap:40px;
    row-gap:56px;
  }

  .art-box{
    display:flex;
    flex-direction:column;
  }

  .art-frame{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    overflow:hidden;
    background:#0c0c0c;
    border-radius:4px;
  }

  .art-frame img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transition:transform 0.5s ease;
  }
  .art-box:hover .art-frame img{
    transform:scale(1.04);
  }

  /* hover-reveal description — overlays the image only, caption below stays put */
  .art-overlay{
    position:absolute;
    inset:0;
    display:flex;
    align-items:flex-end;
    padding:22px;
    background:linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.55) 48%, rgba(0,0,0,0.05) 100%);
    opacity:0;
    transition:opacity 0.3s ease;
  }
  .art-box:hover .art-overlay,
  .art-box:focus-within .art-overlay{
    opacity:1;
  }
  .art-overlay p{
    font-size:13px;
    line-height:1.6;
    color:#e8e8e8;
  }

  /* caption sits below the image, like the reference — always visible */
  .art-caption{
    padding-top:18px;
  }
  .art-title{
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    font-size:18px;
    font-weight:600;
    letter-spacing:-0.015em;
    color:var(--white);
    margin-bottom:6px;
  }
  .art-meta{
    display:flex;
    flex-wrap:wrap;
    gap:6px 10px;
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    font-size:13px;
    font-weight:400;
    color:var(--dim);
  }
  .art-meta span:not(:last-child)::after{
    content:'·';
    margin-left:10px;
    color:rgba(255,255,255,0.3);
  }

  @media (max-width:900px){
    .gallery{ grid-template-columns:repeat(2, 1fr); column-gap:28px; row-gap:44px; }
  }
  @media (max-width:560px){
    .gallery{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<div class="page-header">
  <a class="back-link" href="index.html">

  <h1 class="page-title">Digital Arts</h1>

<div class="gallery" id="gallery"></div>

</body>
</html>
