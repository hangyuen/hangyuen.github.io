<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Arts — Hang Yuan's Web</title>
<link rel="icon" type="image/png" href="assets/hy.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #ffffff;
    --ink: #111111;
    --dim: #8a8a8a;
    --page-gutter: clamp(32px, 9vw, 190px);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html, body{ height:100%; }

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
  }

  a{ color:inherit; text-decoration:none; }

  /* PAGE HEADER — back link, title, short intro, all left-aligned with the
     carousel below */
  .page-header{
    max-width:1920px;
    margin:0 auto;
    padding:48px var(--page-gutter) 0;
  }
  .back-link{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:14px;
    font-weight:500;
    color:var(--ink);
    padding:9px 16px 9px 12px;
    border-radius:999px;
    background:#f2f2f2;
    border:1px solid #e4e4e4;
    transition:background 0.15s ease, transform 0.15s ease;
    margin-bottom:32px;
  }
  .back-link:hover{
    background:#e8e8e8;
    transform:translateY(-1px);
  }
  .back-link svg{ width:16px; height:16px; }

  .page-title{
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    font-size:clamp(32px, 5vw, 52px);
    font-weight:700;
    letter-spacing:-0.02em;
    color:var(--ink);
    margin-bottom:16px;
  }
  .page-description{
    max-width:640px;
    font-size:15px;
    line-height:1.6;
    color:#555;
    margin-bottom:48px;
  }

  /* CAROUSEL — horizontal scroll, snap-to-item, round arrow buttons like
     the reference. Captions sit under each image at all times, no hover. */
  .carousel-wrap{
    position:relative;
    max-width:1920px;
    margin:0 auto;
    padding-bottom:80px;
  }

  .carousel-track{
    display:flex;
    gap:32px;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch;
    padding:0 var(--page-gutter);
    scrollbar-width:none;
    -ms-overflow-style:none;
  }
  .carousel-track::-webkit-scrollbar{ display:none; }

  .art-item{
    flex:0 0 calc((100% - 32px) / 2);
    max-width:1100px;
    scroll-snap-align:start;
  }

  .art-frame{
    position:relative;
    width:100%;
    aspect-ratio:3/2;
    overflow:hidden;
    border-radius:6px;
    background-color:#f0f0f0;
    background-size:cover;
    background-position:center;
  }

  .art-caption{
    padding-top:18px;
  }
  .art-title{
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    font-size:18px;
    font-weight:600;
    letter-spacing:-0.01em;
    color:var(--ink);
    margin-bottom:5px;
  }
  .art-meta{
    display:flex;
    flex-wrap:wrap;
    gap:6px 10px;
    font-size:13px;
    color:var(--dim);
  }
  .art-meta span:not(:last-child)::after{
    content:'·';
    margin-left:10px;
    color:#c9c9c9;
  }

  /* round nav arrows — inset ON TOP of the image content at each end of the
     row (like the reference), not floating outside it in the gutter */
  .carousel-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:44px;
    height:44px;
    border-radius:50%;
    background:rgba(255,255,255,0.92);
    border:1px solid rgba(0,0,0,0.08);
    box-shadow:0 6px 18px rgba(0,0,0,0.18);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:5;
    transition:background 0.15s ease, opacity 0.15s ease;
  }
  .carousel-arrow:hover{ background:#ffffff; }
  .carousel-arrow.prev{ left:calc(var(--page-gutter) + 20px); }
  .carousel-arrow.next{ right:calc(var(--page-gutter) + 20px); }
  .carousel-arrow svg{ width:18px; height:18px; color:#111; }
  .carousel-arrow[disabled]{
    opacity:0;
    pointer-events:none;
  }

  @media (max-width:900px){
    .art-item{ flex:0 0 78vw; max-width:none; }
    .carousel-arrow{ display:none; }
  }
  @media (max-width:560px){
    .art-item{ flex:0 0 88vw; }
  }
</style>
</head>
<body>

<div class="page-header">
  <a class="back-link" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Back
  </a>
  <h1 class="page-title">Digital Arts</h1>
  <p class="page-description">A collection of illustration and digital artwork — replace this with a sentence or two about what ties these pieces together, your process, or the period they're from.</p>
</div>

<div class="carousel-wrap">
  <button type="button" class="carousel-arrow prev" id="prevBtn" aria-label="Previous">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="carousel-track" id="track"></div>
  <button type="button" class="carousel-arrow next" id="nextBtn" aria-label="Next">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
  </button>
</div>

<script>
  // Replace this with your real 6 pieces: image path, title, medium, year.
  const artworks = [
    { image: 'assets/Digital_Art.png', title: 'Untitled Piece 01', medium: 'Digital painting', year: '2026' },
    { image: 'assets/Digital_Art.png', title: 'Untitled Piece 02', medium: 'Digital illustration', year: '2026' },
    { image: 'assets/Digital_Art.png', title: 'Untitled Piece 03', medium: 'Mixed media / digital', year: '2026' },
    { image: 'assets/Digital_Art.png', title: 'Untitled Piece 04', medium: 'Digital painting', year: '2025' },
    { image: 'assets/Digital_Art.png', title: 'Untitled Piece 05', medium: 'Digital illustration', year: '2025' },
    { image: 'assets/Digital_Art.png', title: 'Untitled Piece 06', medium: 'Digital painting', year: '2025' }
  ];

  const track = document.getElementById('track');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  track.innerHTML = artworks.map(art => `
    <div class="art-item">
      <div class="art-frame" style="background-image:url('${art.image}')" role="img" aria-label="${art.title}"></div>
      <div class="art-caption">
        <div class="art-title">${art.title}</div>
        <div class="art-meta">
          <span>${art.medium}</span>
          <span>${art.year}</span>
        </div>
      </div>
    </div>
  `).join('');

  function itemStep(){
    const item = track.querySelector('.art-item');
    if (!item) return 0;
    const gap = parseFloat(getComputedStyle(track).gap) || 0;
    return item.getBoundingClientRect().width + gap;
  }

  // vertically center the arrow buttons against the actual rendered
  // image height, rather than guessing it from a fixed width formula
  const wrap = document.querySelector('.carousel-wrap');
  function positionArrows(){
    const frame = track.querySelector('.art-frame');
    if (!frame) return;
    const wrapRect = wrap.getBoundingClientRect();
    const frameRect = frame.getBoundingClientRect();
    const top = frameRect.top - wrapRect.top + frameRect.height / 2;
    prevBtn.style.top = top + 'px';
    nextBtn.style.top = top + 'px';
  }
  positionArrows();
  window.addEventListener('resize', positionArrows);

  prevBtn.addEventListener('click', () => {
    track.scrollBy({ left: -itemStep(), behavior: 'smooth' });
  });
  nextBtn.addEventListener('click', () => {
    track.scrollBy({ left: itemStep(), behavior: 'smooth' });
  });

  // hide the prev/next arrow when there's nothing left to scroll to on that side
  function updateArrowState(){
    const maxScroll = track.scrollWidth - track.clientWidth - 1;
    prevBtn.disabled = track.scrollLeft <= 0;
    nextBtn.disabled = track.scrollLeft >= maxScroll;
  }
  track.addEventListener('scroll', updateArrowState);
  window.addEventListener('resize', updateArrowState);
  updateArrowState();
</script>

</body>
</html>
