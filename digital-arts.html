<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Arts — Hang Yuan's Web</title>
<link rel="icon" type="image/png" href="assets/hy.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #ffffff;
    --ink: #1d1d1f;
    --dim: #6e6e73;
    --accent: #0071e3;
    --hairline: rgba(0,0,0,0.08);
    /* 1512px ≈ the logical width of a 14.2" laptop screen (e.g. 14" MacBook
       Pro). The whole page is designed at that width; --page-scale then
       enlarges everything uniformly on wider screens instead of just
       adding side margin, and never shrinks below 1x on smaller screens
       (real responsiveness for phones/tablets is handled separately by
       the max-width:900px/560px rules further down). */
    --page-scale: clamp(1, calc(100vw / 1512), 1.8);
    --page-gutter: clamp(40px, 9vw, 136px);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html, body{ height:100%; }

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  /* Everything lives inside .page-scale, laid out as if the screen were
     always exactly 1512px wide (≈14.2", a 14" laptop's logical width).
     Below that width it behaves completely normally. At or above it, the
     media query pins the layout to that 1512px canvas and scales the
     whole thing up with the real screen, so a bigger monitor enlarges
     everything in proportion instead of just adding side margin. */
  .page-scale{
    width:100%;
  }
  @media (min-width:1512px){
    .page-scale{
      width:1512px;
      margin:0 auto;
      transform-origin:top center;
      transform:scale(var(--page-scale));
    }
  }

  a{ color:inherit; text-decoration:none; }

  :focus-visible{
    outline:2px solid var(--accent);
    outline-offset:3px;
    border-radius:4px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition-duration:0.01ms !important; scroll-behavior:auto !important; }
  }

  /* PAGE HEADER — back link, title, short intro, all left-aligned with the
     carousel below */
  .page-header{
    max-width:2400px;
    margin:0 auto;
    padding:56px var(--page-gutter) 0;
  }
  .back-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:14px;
    font-weight:500;
    color:var(--dim);
    padding:4px 0;
    transition:color 0.15s ease, gap 0.15s ease;
    margin-bottom:40px;
  }
  .back-link:hover{
    color:var(--accent);
    gap:9px;
  }
  .back-link svg{ width:15px; height:15px; }

  .page-title{
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    font-size:clamp(34px, 5vw, 56px);
    font-weight:700;
    letter-spacing:-0.02em;
    color:#111111;
    margin-bottom:14px;
  }
  .page-description{
    font-size:17px;
    line-height:1.55;
    color:var(--dim);
    letter-spacing:-0.011em;
    margin-bottom:56px;
  }

  /* CAROUSEL — horizontal scroll, snap-to-item, round arrow buttons like
     the reference. Captions sit under each image at all times, no hover. */
  .carousel-wrap{
    position:relative;
    max-width:2400px;
    margin:0 auto;
    padding-bottom:88px;
  }

  .carousel-track{
    display:flex;
    gap:40px;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    scroll-behavior:smooth;
    -webkit-overflow-scrolling:touch;
    padding:0 var(--page-gutter);
    scrollbar-width:none;
    -ms-overflow-style:none;
  }
  .carousel-track::-webkit-scrollbar{ display:none; }

  .art-item{
    /* nudged up from ~2.4 items per view to ~2.2, giving each frame a bit
       more presence while still comfortably fitting a 14" screen (the
       1512px baseline) without crowding it */
    flex:0 0 calc((100% - 40px) / 2.2);
    max-width:1000px;
    scroll-snap-align:start;
  }

  .art-frame{
    position:relative;
    width:100%;
    aspect-ratio:3/2;
    overflow:hidden;
    border-radius:18px;
    background-color:#f0f0f0;
    background-size:cover;
    background-position:center;
    transition:transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .art-item:hover .art-frame{
    transform:scale(1.012);
  }

  .art-caption{
    padding-top:20px;
  }
  .art-title{
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    font-size:19px;
    font-weight:700;
    letter-spacing:-0.02em;
    color:#111111;
    margin-bottom:4px;
  }
  .art-meta{
    font-size:13px;
    letter-spacing:-0.006em;
    color:var(--dim);
  }
  .art-description{
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    font-size:14.5px;
    line-height:1.65;
    color:#4a4a4a;
    letter-spacing:-0.005em;
    margin-top:14px;
  }
  .art-exhibition{
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    font-size:13px;
    font-style:italic;
    line-height:1.5;
    color:var(--dim);
    margin-top:10px;
  }

  /* round nav arrows — glassy, inset ON TOP of the image content at each
     end of the row, echoing the translucent controls on apple.com */
  .carousel-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:44px;
    height:44px;
    border-radius:50%;
    background:rgba(255,255,255,0.7);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border:1px solid rgba(0,0,0,0.06);
    box-shadow:0 4px 24px rgba(0,0,0,0.12);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:5;
    transition:background 0.2s ease, opacity 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
  }
  .carousel-arrow:hover{
    background:rgba(255,255,255,0.95);
    transform:translateY(-50%) scale(1.06);
    box-shadow:0 6px 28px rgba(0,0,0,0.16);
  }
  .carousel-arrow.prev{ left:calc(var(--page-gutter) + 20px); }
  .carousel-arrow.next{ right:calc(var(--page-gutter) + 20px); }
  .carousel-arrow svg{ width:17px; height:17px; color:#1d1d1f; }
  .carousel-arrow[disabled]{
    opacity:0;
    pointer-events:none;
  }

  @media (max-width:900px){
    .art-item{ flex:0 0 78vw; max-width:none; }
    .carousel-arrow{ display:none; }
  }
  @media (max-width:560px){
    .art-item{ flex:0 0 88vw; }
  }
</style>
</head>
<body>

<div class="page-scale">
<div class="page-header">
  <a class="back-link" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Back
  </a>
  <h1 class="page-title">Digital Arts</h1>
  <p class="page-description">A collection of illustration and digital artwork — replace this with a sentence or two about what ties these pieces together, your process, or the period they're from.</p>
</div>

<div class="carousel-wrap">
  <button type="button" class="carousel-arrow prev" id="prevBtn" aria-label="Previous">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="carousel-track" id="track"></div>
  <button type="button" class="carousel-arrow next" id="nextBtn" aria-label="Next">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
  </button>
</div>
</div>

<script>
  // Replace this with your real 6 pieces: image path, title, medium, year.
  const artworks = [
    { image: 'assets/Upstream.jpg', title: 'Upstream', medium: 'Digital Painting', year: '2025', aspect: '16/9', dimensions: '32 x 18 inches',
      description: "A figure sits chest-deep in a rushing current, calmly reading, anchored against the pull of the water by the quiet act of attention. Around them, the riverbank has burst into a wild tangle of wildflowers: lavender, goldenrod, poppies, and loosestrife crowding the frame in full bloom. Upstream holds two kinds of resistance at once: the physical push of the current, and the mental stillness required to stay present within it. Blooming, here, isn't passive. It happens even as things move against you.",
      exhibition: "Exhibited in Bloom, Mainframe Studios, Des Moines, IA, 2025." },
    { image: 'assets/Open Field, Open Love.jpg', title: 'Open Field, Open Love', medium: 'Digital Painting', year: '2026', aspect: '16/9', dimensions: '32 x 18 inches',
      description: "A figure stands alone in a windswept field, arms thrown open toward a golden retriever running to meet them. The grass bends and blurs around both figures, caught mid-motion, as if the whole landscape is moving with them. Open Field, Open Love speaks to the quiet work of reaching outward after isolation: the vulnerability of opening your arms before you know if anyone will meet you there, and the relief when something does. Connection here isn't loud or dramatic. It's small, animal, and immediate, a reminder that love can arrive on four legs before it arrives any other way.",
      exhibition: "Exhibited in Loneliness, Isolation and Connection, Ludington Area Center for the Arts, Ludington, MI, 2025." },
    { image: 'assets/Digital_Art.png', title: 'Untitled Piece 03', medium: 'Mixed media / digital', year: '2026' },
    { image: 'assets/Digital_Art.png', title: 'Untitled Piece 04', medium: 'Digital painting', year: '2025' },
    { image: 'assets/Digital_Art.png', title: 'Untitled Piece 05', medium: 'Digital illustration', year: '2025' },
    { image: 'assets/Digital_Art.png', title: 'Untitled Piece 06', medium: 'Digital painting', year: '2025' }
  ];

  const track = document.getElementById('track');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  track.innerHTML = artworks.map(art => `
    <div class="art-item">
      <div class="art-frame" style="background-image:url('${art.image}');${art.aspect ? ` aspect-ratio:${art.aspect};` : ''}" role="img" aria-label="${art.title}"></div>
      <div class="art-caption">
        <div class="art-title">${art.title}</div>
        <div class="art-meta">${[art.medium, art.dimensions, art.exhibition ? null : art.year].filter(Boolean).join(', ')}</div>
        ${art.description ? `<p class="art-description">${art.description}</p>` : ''}
        ${art.exhibition ? `<p class="art-exhibition">${art.exhibition}</p>` : ''}
      </div>
    </div>
  `).join('');

  function itemStep(){
    const item = track.querySelector('.art-item');
    if (!item) return 0;
    const gap = parseFloat(getComputedStyle(track).gap) || 0;
    // offsetWidth is the element's local (pre-scale) layout width, which is
    // what scrollBy expects — getBoundingClientRect would return the
    // on-screen (post page-scale) size and overshoot once scale > 1.
    return item.offsetWidth + gap;
  }

  // vertically center the arrow buttons against the actual rendered
  // image height. Uses offsetTop/offsetHeight (local layout units, same
  // space as the arrows' own `top`) rather than getBoundingClientRect,
  // since the latter reflects on-screen size after page-scale and would
  // misplace the buttons once scale > 1.
  const wrap = document.querySelector('.carousel-wrap');
  function positionArrows(){
    const frame = track.querySelector('.art-frame');
    if (!frame) return;
    const top = frame.offsetTop + frame.offsetHeight / 2;
    prevBtn.style.top = top + 'px';
    nextBtn.style.top = top + 'px';
  }
  positionArrows();
  window.addEventListener('resize', positionArrows);

  prevBtn.addEventListener('click', () => {
    track.scrollBy({ left: -itemStep(), behavior: 'smooth' });
  });
  nextBtn.addEventListener('click', () => {
    track.scrollBy({ left: itemStep(), behavior: 'smooth' });
  });

  // hide the prev/next arrow when there's nothing left to scroll to on that side
  function updateArrowState(){
    const maxScroll = track.scrollWidth - track.clientWidth - 1;
    prevBtn.disabled = track.scrollLeft <= 0;
    nextBtn.disabled = track.scrollLeft >= maxScroll;
  }
  track.addEventListener('scroll', updateArrowState);
  window.addEventListener('resize', updateArrowState);
  updateArrowState();
</script>

</body>
</html>
