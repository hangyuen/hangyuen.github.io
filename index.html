<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hang Yuan — Design Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #000000;
    --white: #ffffff;
    --dim: #b7b7b7;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{ height:100%; }

  body{
    background:var(--bg);
    color:var(--white);
    font-family:'Inter', sans-serif;
    overflow-x:hidden;
  }

  a{ color:inherit; text-decoration:none; }

  /* STAGE — full-screen area that will later hold a background video/image.
     To add it: give .stage a background-image, or insert a <video class="stage-media">
     as the FIRST child of .stage (position it absolute, inset:0, object-fit:cover). */
  .stage{
    position:relative;
    width:100%;
    height:100vh;
    min-height:640px;
    background:var(--bg);
    overflow:hidden;
  }

  /* FLOATING PROJECT ICONS */
  .icon{
    position:absolute;
    transform:translate(-50%,-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    cursor:pointer;
  }
  .icon-box{
    width:96px;
    height:96px;
    border-radius:20px;
    background:linear-gradient(145deg, #1e1e1e, #0a0a0a);
    border:1px solid #2a2a2a;
    box-shadow:0 12px 30px rgba(0,0,0,0.5);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    color:var(--dim);
    text-align:center;
    transition:transform 0.2s ease, border-color 0.2s ease;
  }
  .icon:hover .icon-box{
    transform:translateY(-4px) scale(1.04);
    border-color:#444;
  }
  .icon-label{
    font-size:14px;
    font-weight:500;
    color:var(--white);
    text-shadow:0 2px 10px rgba(0,0,0,0.6);
    white-space:nowrap;
  }

  /* approximate positions, matching the scattered layout */
  .icon.p1{ top:18%; left:66%; }   /* Mindo Branding */
  .icon.p2{ top:26%; left:26%; }   /* Attention Type */
  .icon.p3{ top:35%; left:74%; }   /* Line of Contamination */
  .icon.p4{ top:41%; left:43%; }   /* Threading Inwards */
  .icon.p5{ top:52%; left:23%; }   /* Art Book Design */
  .icon.p6{ top:52%; left:68%; }   /* Voice AI */

  /* DOCK */
  .dock{
    position:fixed;
    left:50%; bottom:34px;
    transform:translateX(-50%);
    z-index:10;
    display:flex;
    align-items:center;
    gap:14px;
    padding:12px 16px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:24px;
    backdrop-filter:blur(16px);
  }
  .dock-item{
    width:56px;
    height:56px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#151515;
    border:1px solid #2a2a2a;
    transition:transform 0.15s ease;
  }
  .dock-item:hover{ transform:translateY(-6px); }
  .dock-item.avatar{
    background:linear-gradient(135deg, #444, #111);
    font-weight:700;
    font-size:16px;
    overflow:hidden;
    padding:0;
  }
  .dock-item.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:14px;
  }
  .dock-item svg{ width:26px; height:26px; }
  .dock-item.brand{
    background:transparent;
    border:none;
    padding:4px;
  }
  .dock-item.brand img{
    width:100%;
    height:100%;
    object-fit:contain;
  }
  .dock-divider{
    width:1px;
    height:36px;
    background:rgba(255,255,255,0.16);
    margin:0 2px;
  }

  @media (max-width:640px){
    .icon-box{ width:72px; height:72px; border-radius:16px; }
    .icon-label{ font-size:12px; }
    .dock{ gap:10px; padding:10px 12px; bottom:20px; }
    .dock-item{ width:46px; height:46px; }
  }
</style>
</head>
<body>

<div class="stage">
  <!-- Insert a background <video> or background-image on .stage when ready -->

  <a class="icon p1" href="#">
    <div class="icon-box">Mindo</div>
    <div class="icon-label">Mindo Branding</div>
  </a>
  <a class="icon p2" href="#">
    <div class="icon-box">Type</div>
    <div class="icon-label">Attention Type</div>
  </a>
  <a class="icon p3" href="#">
    <div class="icon-box">Line</div>
    <div class="icon-label">Line of Contamination</div>
  </a>
  <a class="icon p4" href="#">
    <div class="icon-box">Book</div>
    <div class="icon-label">Threading Inwards</div>
  </a>
  <a class="icon p5" href="#">
    <div class="icon-box">Art</div>
    <div class="icon-label">Art Book Design</div>
  </a>
  <a class="icon p6" href="#">
    <div class="icon-box">Voice</div>
    <div class="icon-label">Voice AI</div>
  </a>
</div>

<div class="dock">
  <a class="dock-item avatar" href="about.html"><img src="hyuan.png" alt="Hang Yuan"></a>
  <a class="dock-item" href="#" title="Notes">
    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
  </a>
  <a class="dock-item" href="#" title="Work">
    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9 9h6v6H9z"/></svg>
  </a>
  <div class="dock-divider"></div>
  <a class="dock-item brand" href="https://instagram.com/yourhandle" target="_blank" rel="noopener">
    <img src="Instagram.svg" alt="Instagram">
  </a>
  <a class="dock-item brand" href="https://www.linkedin.com/in/-hangyuan-" target="_blank" rel="noopener">
    <img src="LinkedIn.png" alt="LinkedIn">
  </a>
</div>

</body>
</html>
