<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hang Yuan — Design Portfolio</title>
<link rel="icon" type="image/png" href="hy.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #000000;
    --white: #ffffff;
    --dim: #b7b7b7;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{ height:100%; }

  body{
    background:var(--bg);
    color:var(--white);
    font-family:'Inter', sans-serif;
    overflow-x:hidden;
  }

  a{ color:inherit; text-decoration:none; }

  /* STAGE — full-screen area that will later hold a background video/image.
     To add it: give .stage a background-image, or insert a <video class="stage-media">
     as the FIRST child of .stage (position it absolute, inset:0, object-fit:cover). */
  .stage{
    position:relative;
    width:100%;
    height:100vh;
    min-height:640px;
    background:var(--bg);
    overflow:hidden;
  }

  /* FLOATING PROJECT ICONS */
  .icon{
    position:absolute;
    transform:translate(-50%,-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    cursor:grab;
    touch-action:none;
    user-select:none;
  }
  .icon.dragging{
    cursor:grabbing;
    z-index:5;
  }
  .icon-box{
    width:112px;
    height:112px;
    border-radius:24px;
    background:linear-gradient(145deg, #1e1e1e, #0a0a0a);
    border:1px solid #2a2a2a;
    box-shadow:0 12px 30px rgba(0,0,0,0.5);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    color:var(--dim);
    text-align:center;
    transition:transform 0.2s ease, border-color 0.2s ease;
    overflow:hidden;
  }
  .icon-box img{
    width:100%;
    height:100%;
    object-fit:cover;
    -webkit-user-drag:none;
    user-select:none;
    pointer-events:none;
  }
  .icon:hover .icon-box{
    transform:translateY(-4px) scale(1.04);
    border-color:#444;
  }
  .icon.selected .icon-box{
    background:linear-gradient(145deg, rgba(10,132,255,0.30), rgba(10,132,255,0.14));
    border-color:rgba(10,132,255,0.85);
    box-shadow:0 0 0 3px rgba(10,132,255,0.35), 0 12px 30px rgba(0,0,0,0.5);
  }
  .icon-label{
    font-size:14px;
    font-weight:500;
    color:var(--white);
    text-shadow:0 2px 10px rgba(0,0,0,0.6);
    white-space:nowrap;
    padding:2px 9px;
    border-radius:6px;
    transition:background 0.15s ease;
  }
  .icon.selected .icon-label{
    background:rgba(10,132,255,0.55);
    text-shadow:none;
  }

  /* approximate positions, matching the scattered layout */
  .icon.p1{ top:18%; left:66%; }   /* Mindo Branding */
  .icon.p2{ top:26%; left:26%; }   /* Attention Type */
  .icon.p3{ top:35%; left:74%; }   /* Line of Contamination */
  .icon.p4{ top:41%; left:43%; }   /* Threading Inwards */
  .icon.p5{ top:52%; left:23%; }   /* Art Book Design */
  .icon.p6{ top:52%; left:68%; }   /* Voice AI */

  /* DOCK */
  .dock{
    position:fixed;
    left:50%; bottom:34px;
    transform:translateX(-50%);
    z-index:10;
    display:flex;
    align-items:center;
    gap:14px;
    padding:12px 16px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.14);
    border-radius:24px;
    backdrop-filter:blur(16px);
  }
  .dock-item{
    width:64px;
    height:64px;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#151515;
    border:1px solid #2a2a2a;
    transition:transform 0.15s ease;
    position:relative;
  }
  .dock-item[data-tip]::after{
    content:attr(data-tip);
    position:absolute;
    bottom:calc(100% + 14px);
    left:50%;
    transform:translate(-50%, 4px);
    background:#fdfdfd;
    color:#111;
    font-size:13px;
    font-weight:600;
    padding:6px 13px;
    border-radius:14px;
    white-space:nowrap;
    box-shadow:0 8px 20px rgba(0,0,0,0.35);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.15s ease, transform 0.15s ease;
  }
  .dock-item[data-tip]::before{
    content:'';
    position:absolute;
    bottom:calc(100% + 8px);
    left:50%;
    transform:translate(-50%, 4px);
    border:6px solid transparent;
    border-top-color:#fdfdfd;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.15s ease, transform 0.15s ease;
  }
  .dock-item[data-tip]:hover::after,
  .dock-item[data-tip]:hover::before{
    opacity:1;
    transform:translate(-50%, 0);
  }
  .dock-item:hover{ transform:translateY(-6px); }
  .dock-item.avatar{
    background:linear-gradient(135deg, #444, #111);
    font-weight:700;
    font-size:16px;
    overflow:hidden;
    padding:0;
  }
  .dock-item.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:16px;
  }
  .dock-item svg{ width:26px; height:26px; }
  .dock-item.brand{
    background:transparent;
    border:none;
    padding:0;
    overflow:hidden;
  }
  .dock-item.brand img{
    width:100%;
    height:100%;
    object-fit:cover;
    border-radius:16px;
  }
  .dock-divider{
    width:1px;
    height:36px;
    background:rgba(255,255,255,0.16);
    margin:0 2px;
  }

  @media (max-width:640px){
    .icon-box{ width:72px; height:72px; border-radius:16px; }
    .icon-label{ font-size:12px; }
    .dock{ gap:10px; padding:10px 12px; bottom:20px; }
    .dock-item{ width:46px; height:46px; }
  }
</style>
</head>
<body>

<div class="stage">
  <!-- Insert a background <video> or background-image on .stage when ready -->

  <div class="icon p1">
    <div class="icon-box">VR</div>
    <div class="icon-label">Virtual Reality</div>
  </div>
  <div class="icon p2">
    <div class="icon-box">AR</div>
    <div class="icon-label">Augmented Reality</div>
  </div>
  <div class="icon p3">
    <div class="icon-box">CM</div>
    <div class="icon-label">Computer Modeling</div>
  </div>
  <div class="icon p4">
    <div class="icon-box">VFX</div>
    <div class="icon-label">Animation &amp; Visual Effects</div>
  </div>
  <div class="icon p5">
    <div class="icon-box"><img src="Digital_Art.png" alt="Digital Arts"></div>
    <div class="icon-label">Digital Arts</div>
  </div>
  <div class="icon p6">
    <div class="icon-box">Pub</div>
    <div class="icon-label">Publications</div>
  </div>
</div>

<div class="dock">
  <a class="dock-item avatar" href="about.html" data-tip="About Me"><img src="hyuan.png" alt="Hang Yuan"></a>
  <a class="dock-item brand" href="mailto:you@example.com" data-tip="Let's Connect">
    <img src="Mail.png" alt="Mail">
  </a>
  <div class="dock-divider"></div>
  <a class="dock-item brand" href="https://www.instagram.com/hang_yuan_/" target="_blank" rel="noopener" data-tip="Instagram">
    <img src="Instagram.svg" alt="Instagram">
  </a>
  <a class="dock-item brand" href="https://www.linkedin.com/in/-hangyuan-" target="_blank" rel="noopener" data-tip="LinkedIn">
    <img src="LinkedIn.png" alt="LinkedIn">
  </a>
</div>

<script>
  // Makes each .icon draggable within .stage, using mouse or touch.
  const stage = document.querySelector('.stage');
  const icons = document.querySelectorAll('.icon');

  icons.forEach(icon => {
    let dragging = false;
    let startX, startY, startLeftPx, startTopPx, moved;

    icon.addEventListener('pointerdown', (e) => {
      dragging = true;
      moved = 0;
      icon.classList.add('dragging');
      icon.setPointerCapture(e.pointerId);

      const stageRect = stage.getBoundingClientRect();
      const iconRect = icon.getBoundingClientRect();

      // convert current center position to px within the stage
      startLeftPx = iconRect.left - stageRect.left + iconRect.width / 2;
      startTopPx = iconRect.top - stageRect.top + iconRect.height / 2;

      startX = e.clientX;
      startY = e.clientY;

      // switch from % to px so dragging is smooth
      icon.style.left = startLeftPx + 'px';
      icon.style.top = startTopPx + 'px';
    });

    icon.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      moved = Math.max(moved, Math.abs(dx), Math.abs(dy));

      const stageRect = stage.getBoundingClientRect();
      let newLeft = startLeftPx + dx;
      let newTop = startTopPx + dy;

      // keep icon roughly within the stage bounds
      newLeft = Math.max(20, Math.min(stageRect.width - 20, newLeft));
      newTop = Math.max(20, Math.min(stageRect.height - 20, newTop));

      icon.style.left = newLeft + 'px';
      icon.style.top = newTop + 'px';
    });

    const endDrag = (e) => {
      if (!dragging) return;
      dragging = false;
      icon.classList.remove('dragging');
      icon.releasePointerCapture(e.pointerId);

      // treat as a click (select) only if it barely moved
      if (moved < 6) {
        const alreadySelected = icon.classList.contains('selected');
        icons.forEach(i => i.classList.remove('selected'));
        if (!alreadySelected) icon.classList.add('selected');
      }
    };

    icon.addEventListener('pointerup', endDrag);
    icon.addEventListener('pointercancel', endDrag);

    // double-click / double-tap to open (add a real link via data-href later)
    icon.addEventListener('dblclick', () => {
      const link = icon.dataset.href;
      if (link) window.open(link, '_blank');
    });
  });

  // clicking empty stage area deselects all icons
  stage.addEventListener('pointerdown', (e) => {
    if (e.target === stage) {
      icons.forEach(i => i.classList.remove('selected'));
    }
  });
</script>

</body>
</html>
