<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hang Yuan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@800;900&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #111111;
    --green: #80d197;
    --white: #f3f1ec;
    --dim: #9a9c98;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body{ height:100%; }

  body{
    background:var(--bg);
    color:var(--white);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  a{ color:inherit; text-decoration:none; }

  /* NAV */
  nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:28px 40px;
    font-weight:700;
    font-size:16px;
  }
  .nav-links{ display:flex; gap:26px; }
  .nav-links a:hover{ color:var(--green); }
  .nav-social{ display:flex; gap:18px; }
  .nav-social a:hover{ color:var(--green); }

  /* HERO */
  main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
  }
  h1{
    font-family:'Roboto Slab', serif;
    color:var(--green);
    text-align:center;
    font-weight:900;
    font-size:clamp(60px, 13vw, 160px);
    line-height:0.9;
    letter-spacing:-0.01em;
    transform:scaleX(0.72);
    max-width:1300px;
  }

  main img{
    display:block;
    width:140px;
    margin-top:-10px;
    margin-bottom:0;
    vertical-align:bottom;
  }

  @media (max-width:640px){
    nav{ flex-direction:column; gap:12px; padding:22px 20px; }
    .nav-links{ gap:16px; font-size:14px; }
  }
</style>
</head>
<body>

<nav>
  <span>Hang Yuan</span>
  <div class="nav-links">
    <a href="#work">work</a>
    <a href="#about">about</a>
    <a href="#contact">contact</a>
  </div>
  <div class="nav-social">
    <a href="mailto:you@example.com">email</a>
    <a href="https://github.com/hangyuan168" target="_blank" rel="noopener">gh</a>
  </div>
</nav>

<main>
  <h1>artist<br>designer<br>educator</h1>
  <img src="hyuan.PNG" alt="Hang Yuan">
</main>

</body>
</html>
