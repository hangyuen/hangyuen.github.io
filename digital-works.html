<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="format-detection" content="address=no, telephone=no, email=no, date=no">
<title>Digital Works · Hang Yuan's Web</title>
<link rel="icon" type="image/png" href="assets/hy.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #ffffff;
    --ink: #1d1d1f;
    --dim: #6e6e73;
    --accent: #0071e3;
    --hairline: rgba(0,0,0,0.08);
    --page-gutter: clamp(40px, 9vw, 123px);
    /* fixed height for the text block under each frame, so a card with a
       long description and a card with none still line up along the same
       baseline in the row */
    --caption-height: 150px;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html{ height:100%; }
  body{ min-height:100%; }

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    padding-bottom:56px; /* same as the 56px above the Back link */
  }

  a{ color:inherit; text-decoration:none; }

  :focus-visible{
    outline:2px solid var(--accent);
    outline-offset:3px;
    border-radius:4px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition-duration:0.01ms !important; scroll-behavior:auto !important; animation-duration:0.01ms !important; animation-iteration-count:1 !important; }
  }

  @keyframes arrowAttention{
    0%, 100% {
      box-shadow:
        0 10px 30px rgba(0,0,0,0.14),
        0 2px 6px rgba(0,0,0,0.08),
        inset 0 1px 1px rgba(255,255,255,0.9),
        inset 0 -1px 1px rgba(0,0,0,0.04),
        0 0 0 0 rgba(0,113,227,0);
    }
    50% {
      box-shadow:
        0 10px 30px rgba(0,0,0,0.14),
        0 2px 6px rgba(0,0,0,0.08),
        inset 0 1px 1px rgba(255,255,255,0.9),
        inset 0 -1px 1px rgba(0,0,0,0.04),
        0 0 0 12px rgba(0,113,227,0.32),
        0 0 22px 4px rgba(0,113,227,0.35);
    }
  }

  /* PAGE HEADER */
  .page-header{
    max-width:2400px;
    margin:0 auto;
    padding:56px var(--page-gutter) 0;
  }
  .back-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:16px;
    font-weight:500;
    line-height:19px;
    color:var(--dim);
    padding:4px 0;
    transition:color 0.15s ease, gap 0.15s ease;
    margin-bottom:40px;
  }
  .back-link:hover{
    color:var(--accent);
    gap:9px;
  }
  .back-link svg{ width:16px; height:16px; }

  .page-title{
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    font-size:clamp(34px, 5vw, 56px);
    font-weight:700;
    letter-spacing:-0.02em;
    color:#111111;
    margin-bottom:14px;
  }
  .page-description{
    font-size:17px;
    line-height:1.55;
    color:var(--dim);
    letter-spacing:-0.011em;
    margin-bottom:56px;
  }

  /* CAROUSEL */
  .carousel-wrap{
    position:relative;
    max-width:2400px;
    margin:0 auto;
    padding-bottom:12px;
  }

  .carousel-track{
    display:flex;
    gap:40px;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    scroll-behavior:smooth;
    scroll-padding-inline:var(--page-gutter);
    -webkit-overflow-scrolling:touch;
    padding:0 var(--page-gutter);
    scrollbar-width:none;
    -ms-overflow-style:none;
  }
  .carousel-track::-webkit-scrollbar{ display:none; }

  /* Card width follows BOTH the screen's width and its height, so the
     whole card (artwork + full caption) always fits on screen at once:
     - 13" laptops (~1280–1470 wide, ~700–830 tall): ~660–760px cards
     - iMac / large monitors: grows up to 1120px
     The height term reserves room for the caption and dots below the
     frame, then converts the leftover height to a 16:9 width. */
  .art-item{
    --card-w: clamp(320px, min(52vw, calc((100svh - 300px) * 16 / 9)), 1120px);
    flex:0 0 var(--card-w);
    width:var(--card-w);
    scroll-snap-align:start;
    display:flex;
    flex-direction:column;
  }

  .art-frame{
    position:relative;
    width:100%;
    aspect-ratio:3/2;
    overflow:hidden;
    border-radius:18px;
    background-color:#f0f0f0;
    transition:transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .art-frame img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .art-item:hover .art-frame{
    transform:scale(1.012);
  }

  /* video facade */
  .video-facade{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:0;
    cursor:pointer;
    background:#111;
  }
  .video-facade img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    transition:opacity 0.2s ease;
  }
  .video-facade:hover img{
    opacity:0.85;
  }
  .art-video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:0;
  }

  /* LIVE WEBSITE PREVIEW — the site renders at desktop width (1440px),
     then JS scales it down to fit the frame. Clicks go to the overlay
     link, which opens the real site in a new tab. */
  .site-frame{ background:#fff; }
  .site-embed{
    position:absolute;
    top:0;
    left:0;
    width:1440px;
    height:810px;
    border:0;
    transform-origin:0 0;
    pointer-events:none;
  }
  .site-overlay{
    position:absolute;
    inset:0;
    z-index:2;
    cursor:pointer;
  }

  .art-caption{
    padding-top:16px;
    flex:1;
    min-height:var(--caption-height);
    display:flex;
    flex-direction:column;
  }
  .art-title{
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    font-size:19px;
    font-weight:700;
    letter-spacing:-0.02em;
    color:#111111;
    margin-bottom:4px;
  }
  .art-meta{
    font-size:13px;
    letter-spacing:-0.006em;
    color:var(--dim);
  }
  .art-description{
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    font-size:14.5px;
    line-height:1.65;
    color:#4a4a4a;
    letter-spacing:-0.005em;
    margin-top:12px;
  }
  .art-exhibition{
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    font-size:13px;
    font-style:italic;
    line-height:1.5;
    color:var(--dim);
    margin-top:auto;
    padding-top:10px;
  }
  .art-link{
    font-size:14px;
    font-weight:500;
    color:var(--accent);
    padding-top:10px;
    align-self:flex-start;
  }
  .art-link:hover{ text-decoration:underline; }

  /* round nav arrows */
  .carousel-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:56px;
    height:56px;
    border-radius:50%;
    background:linear-gradient(155deg, rgba(255,255,255,0.85), rgba(255,255,255,0.55));
    backdrop-filter:blur(24px) saturate(200%);
    -webkit-backdrop-filter:blur(24px) saturate(200%);
    border:1px solid rgba(255,255,255,0.6);
    box-shadow:
      0 10px 30px rgba(0,0,0,0.14),
      0 2px 6px rgba(0,0,0,0.08),
      inset 0 1px 1px rgba(255,255,255,0.9),
      inset 0 -1px 1px rgba(0,0,0,0.04);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:5;
    transition:background 0.2s ease, opacity 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    animation:arrowAttention 2.2s ease-in-out 3;
  }
  .carousel-arrow:hover{
    background:linear-gradient(155deg, rgba(255,255,255,0.96), rgba(255,255,255,0.75));
    border-color:rgba(0,113,227,0.35);
    transform:translateY(-50%) scale(1.08);
    box-shadow:
      0 14px 34px rgba(0,0,0,0.18),
      0 3px 8px rgba(0,0,0,0.1),
      inset 0 1px 1px rgba(255,255,255,0.95),
      0 0 0 5px rgba(0,113,227,0.14);
  }
  .carousel-arrow:hover svg{
    color:var(--accent);
    transition:color 0.2s ease, transform 0.2s ease;
  }
  .carousel-arrow.prev:hover svg{ transform:translateX(-2px); }
  .carousel-arrow.next:hover svg{ transform:translateX(2px); }
  .carousel-arrow.prev{ left:calc(var(--page-gutter) + 20px); }
  .carousel-arrow.next{ right:calc(var(--page-gutter) + 20px); }
  .carousel-arrow svg{ width:22px; height:22px; color:#1d1d1f; }
  .carousel-arrow[disabled]{
    opacity:0;
    pointer-events:none;
  }

  /* progress dots */
  .carousel-dots{
    display:flex;
    justify-content:center;
    gap:8px;
    padding-top:28px;
  }
  .carousel-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:rgba(0,0,0,0.16);
    border:0;
    padding:0;
    cursor:pointer;
    transition:background 0.2s ease, transform 0.2s ease;
  }
  .carousel-dot:hover{ background:rgba(0,0,0,0.32); }
  .carousel-dot.active{
    background:var(--accent);
    transform:scale(1.25);
  }

  /* Tall screens (iMac, large monitors): there's enough height to fit
     the header AND the whole card with no scrolling, so size for that. */
  @media (min-height:1000px){
    .art-item{
      --card-w: clamp(320px, min(52vw, calc((100svh - 590px) * 16 / 9)), 1120px);
    }
  }

  @media (min-width:1800px) and (min-height:1000px){
    .art-title{ font-size:21px; }
    .art-meta{ font-size:14px; }
    .art-description{ font-size:15.5px; }
    .art-exhibition{ font-size:14px; }
  }

  /* TABLETS & PHONES — one card at a time, swiped with a finger.
     Width also respects screen height so a phone held sideways never
     gets a frame taller than the screen. */
  @media (max-width:900px){
    :root{ --caption-height: 0px; }
    .art-item{ --card-w: min(78vw, calc((100svh - 150px) * 16 / 9)); }
    .carousel-arrow{ display:none; }
    /* each card only as tall as its own caption, and the exhibition
       line follows the text instead of being pushed to the bottom */
    .carousel-track{ align-items:flex-start; }
    .art-exhibition{ margin-top:0; }
    /* no hover-lift on touch screens */
    .art-item:hover .art-frame{ transform:none; }
  }
  @media (max-width:560px){
    /* card lines up exactly with the title above it on both sides,
       and the next card peeks in at the right edge as a swipe hint */
    .carousel-track{ gap:14px; }
    .art-item{ --card-w: calc(100vw - var(--page-gutter) * 2); }
    .art-frame{ border-radius:14px; }
    .art-title{ font-size:18px; }
    .art-description{ font-size:15px; line-height:1.6; }
  }
  /* bigger tap area for the dots on touch screens, same dot look */
  @media (hover:none){
    .carousel-dots{ gap:0; padding-top:8px; }
    .carousel-dot{
      width:23px;
      height:27px;
      background:transparent;
      position:relative;
    }
    .carousel-dot::before{
      content:"";
      position:absolute;
      top:50%; left:50%;
      width:7px; height:7px;
      margin:-3.5px 0 0 -3.5px;
      border-radius:50%;
      background:rgba(0,0,0,0.16);
      transition:background 0.2s ease, transform 0.2s ease;
    }
    .carousel-dot:hover{ background:transparent; }
    .carousel-dot.active{ background:transparent; transform:none; }
    .carousel-dot.active::before{ background:var(--accent); transform:scale(1.25); }
    /* close button easier to hit on phones */
    .lightbox-close{ top:16px; right:16px; }
  }

  /* ZOOM TRIGGER */
  .zoom-trigger{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%) scale(0.9);
    width:56px;
    height:56px;
    border-radius:50%;
    background:linear-gradient(155deg, rgba(255,255,255,0.9), rgba(255,255,255,0.62));
    backdrop-filter:blur(24px) saturate(200%);
    -webkit-backdrop-filter:blur(24px) saturate(200%);
    border:1px solid rgba(255,255,255,0.65);
    box-shadow:
      0 10px 28px rgba(0,0,0,0.16),
      0 2px 6px rgba(0,0,0,0.08),
      inset 0 1px 1px rgba(255,255,255,0.95),
      inset 0 -1px 1px rgba(0,0,0,0.04);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:zoom-in;
    z-index:4;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.2s ease, transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
  }
  .zoom-trigger svg{ width:22px; height:22px; color:#1d1d1f; transition:color 0.2s ease; }
  .art-frame:hover .zoom-trigger,
  .art-frame:focus-within .zoom-trigger{
    opacity:1;
    pointer-events:auto;
    transform:translate(-50%, -50%) scale(1);
  }
  .zoom-trigger:hover{
    background:linear-gradient(155deg, rgba(255,255,255,0.98), rgba(255,255,255,0.8));
    box-shadow:
      0 14px 32px rgba(0,0,0,0.2),
      0 3px 8px rgba(0,0,0,0.1),
      inset 0 1px 1px rgba(255,255,255,1),
      0 0 0 5px rgba(0,113,227,0.14);
  }
  .zoom-trigger:hover svg{ color:var(--accent); }
  @media (hover:none){
    .zoom-trigger{ opacity:1; pointer-events:auto; transform:translate(-50%, -50%) scale(1); }
  }

  /* ZOOM LIGHTBOX */
  .lightbox{
    position:fixed;
    inset:0;
    background:rgba(20,20,22,0.92);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s ease;
  }
  .lightbox.open{ opacity:1; pointer-events:auto; }
  .lightbox-stage{
    position:relative;
    width:90vw;
    height:86vh;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    touch-action:none;
  }
  .lightbox-stage img{
    max-width:90vw;
    max-height:86vh;
    width:auto;
    height:auto;
    user-select:none;
    -webkit-user-drag:none;
    transition:transform 0.15s ease;
    will-change:transform;
  }
  .lightbox-stage.dragging img{ transition:none; cursor:grabbing; }
  .lightbox-close{
    position:absolute;
    top:24px;
    right:24px;
    width:44px;
    height:44px;
    border-radius:50%;
    background:linear-gradient(155deg, rgba(255,255,255,0.16), rgba(255,255,255,0.06));
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border:1px solid rgba(255,255,255,0.22);
    box-shadow:
      0 8px 24px rgba(0,0,0,0.3),
      inset 0 1px 1px rgba(255,255,255,0.25);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:background 0.2s ease, transform 0.2s ease;
  }
  .lightbox-close:hover{
    background:linear-gradient(155deg, rgba(255,255,255,0.26), rgba(255,255,255,0.1));
    transform:scale(1.06);
  }
  .lightbox-close svg{ width:18px; height:18px; }
  .lightbox-controls{
    position:absolute;
    bottom:28px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    gap:2px;
    background:linear-gradient(155deg, rgba(255,255,255,0.16), rgba(255,255,255,0.06));
    border:1px solid rgba(255,255,255,0.22);
    border-radius:999px;
    padding:6px;
    backdrop-filter:blur(24px) saturate(200%);
    -webkit-backdrop-filter:blur(24px) saturate(200%);
    box-shadow:
      0 10px 30px rgba(0,0,0,0.3),
      inset 0 1px 1px rgba(255,255,255,0.25);
  }
  .lightbox-btn{
    width:40px;
    height:40px;
    border-radius:50%;
    background:transparent;
    border:0;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:19px;
    line-height:1;
    transition:background 0.2s ease, opacity 0.2s ease;
  }
  .lightbox-btn:hover{ background:rgba(255,255,255,0.16); }
  .lightbox-btn:disabled{ opacity:0.35; cursor:default; pointer-events:none; }
  .lightbox-btn svg{ width:18px; height:18px; }
  .lightbox-zoom-label{
    min-width:46px;
    text-align:center;
    color:rgba(255,255,255,0.85);
    font-size:13px;
    font-variant-numeric:tabular-nums;
  }
</style>
</head>

<div class="page-header">
  <a class="back-link" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>

  </a>
  <h1 class="page-title">Digital Works</h1>
  <p class="page-description">Selected works across digital art, motion design, 3D modeling, and visual communication. Swipe through to explore.</p>
</div>

<div class="carousel-wrap">
  <button type="button" class="carousel-arrow prev" id="prevBtn" aria-label="Previous">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="carousel-track" id="track"></div>
  <button type="button" class="carousel-arrow next" id="nextBtn" aria-label="Next">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
  </button>
</div>
<div class="carousel-dots" id="dots"></div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Zoomed artwork">
  <div class="lightbox-stage" id="lightboxStage">
    <img id="lightboxImg" src="" alt="">
  </div>
  <button type="button" class="lightbox-close" id="lightboxClose" aria-label="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
  </button>
  <div class="lightbox-controls">
    <button type="button" class="lightbox-btn" id="zoomOutBtn" aria-label="Zoom out">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M8 11h6"/></svg>
    </button>
    <span class="lightbox-zoom-label" id="zoomLabel">100%</span>
    <button type="button" class="lightbox-btn" id="zoomInBtn" aria-label="Zoom in">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M11 8v6M8 11h6"/></svg>
    </button>
  </div>
</div>

    { title: 'Ant', medium: 'Computer Modeling', year: '2022', aspect: '16/9', sketchfab: 'https://sketchfab.com/models/e40c720c50ef4a25ad32abc53c4d619c/embed',
      description: "A stylized 3D ant character created for a children’s game, combining simplified forms and playful proportions to create a friendly and engaging character for an interactive game environment." }
  ];

  const track = document.getElementById('track');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const dotsWrap = document.getElementById('dots');

  function frameStyle(art){
    return art.aspect ? ` style="aspect-ratio:${art.aspect};"` : '';
  }

  function renderFrame(art, i){
    if (art.video){
      return `<div class="art-frame"${frameStyle(art)}>
        <iframe class="art-video"
          src="https://www.youtube.com/embed/${art.video}"
          title="${art.title}"
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen></iframe>
      </div>`;
    }
    if (art.website){
      return `<div class="art-frame site-frame"${frameStyle(art)}>
        <iframe class="site-embed" src="${art.website}" title="${art.title}" loading="lazy" tabindex="-1"></iframe>
        <a class="site-overlay" href="${art.website}" target="_blank" rel="noopener" aria-label="Open ${art.title} in a new tab"></a>
      </div>`;
    }
    if (art.sketchfab){
      return `<div class="art-frame"${frameStyle(art)}>
        <iframe class="art-video"
          src="${art.sketchfab}"
          title="${art.title}"
          frameborder="0"
          allow="autoplay; fullscreen; xr-spatial-tracking"
          allowfullscreen></iframe>
      </div>`;
    }
    return `<div class="art-frame"${frameStyle(art)}>
      <img src="${art.image}" alt="${art.title}" loading="${i < 3 ? 'eager' : 'lazy'}">
      <button type="button" class="zoom-trigger" data-image="${art.image}" data-title="${art.title}" aria-label="Zoom into ${art.title}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M11 8v6M8 11h6"/></svg>
      </button>
    </div>`;
  }

  track.innerHTML = artworks.map((art, i) => `
    <div class="art-item">
      ${renderFrame(art, i)}
      <div class="art-caption">
        <div class="art-title">${art.title}</div>
        <div class="art-meta">${[art.medium, art.dimensions, art.year].filter(Boolean).join(', ')}</div>
        ${art.description ? `<p class="art-description">${art.description}</p>` : ''}
        ${art.exhibition ? `<p class="art-exhibition">${art.exhibition}</p>` : ''}
        ${art.link ? `<a class="art-link" href="${art.link}" target="_blank" rel="noopener">Visit live site →</a>` : ''}
      </div>
    </div>
  `).join('');

  // shrink the live-site preview so the full desktop layout fits the frame
  function scaleSites(){
    document.querySelectorAll('.site-frame').forEach(f => {
      const s = f.offsetWidth / 1440;
      f.querySelector('.site-embed').style.transform = `scale(${s})`;
    });
  }
  scaleSites();
  window.addEventListener('resize', scaleSites);

  // swap a video facade for a real iframe only on click
  track.querySelectorAll('.video-facade').forEach(btn => {
    btn.addEventListener('click', () => {
      const iframe = document.createElement('iframe');
      iframe.className = 'art-video';
      iframe.src = `https://www.youtube.com/embed/${btn.dataset.video}?autoplay=1`;
      iframe.title = btn.dataset.title;
      iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
      iframe.allowFullscreen = true;
      btn.replaceWith(iframe);
    });
  });

  function itemStep(){
    const item = track.querySelector('.art-item');
    if (!item) return 0;
    const gap = parseFloat(getComputedStyle(track).gap) || 0;
    return item.offsetWidth + gap;
  }

  // vertically center the arrow buttons against the rendered image height
  function positionArrows(){
    const frame = track.querySelector('.art-frame');
    if (!frame) return;
    const top = frame.offsetTop + frame.offsetHeight / 2;
    prevBtn.style.top = top + 'px';
    nextBtn.style.top = top + 'px';
  }
  positionArrows();
  window.addEventListener('resize', positionArrows);

  prevBtn.addEventListener('click', () => {
    track.scrollBy({ left: -itemStep(), behavior: 'smooth' });
  });
  nextBtn.addEventListener('click', () => {
    track.scrollBy({ left: itemStep(), behavior: 'smooth' });
  });

  // dots
  dotsWrap.innerHTML = artworks.map((_, i) =>
    `<button type="button" class="carousel-dot" data-index="${i}" aria-label="Go to piece ${i + 1}"></button>`
  ).join('');
  const dots = Array.from(dotsWrap.children);
  dots.forEach(dot => {
    dot.addEventListener('click', () => {
      const i = Number(dot.dataset.index);
      track.scrollTo({ left: i * itemStep(), behavior: 'smooth' });
    });
  });

  function updateDots(){
    const step = itemStep();
    if (!step) return;
    const maxScroll = track.scrollWidth - track.clientWidth - 1;
    // at the far end, light up the last dot even if it can't snap to the start
    const active = track.scrollLeft >= maxScroll ? artworks.length - 1 : Math.round(track.scrollLeft / step);
    dots.forEach((dot, i) => dot.classList.toggle('active', i === active));
  }

  function updateArrowState(){
    const maxScroll = track.scrollWidth - track.clientWidth - 1;
    prevBtn.disabled = track.scrollLeft <= 0;
    nextBtn.disabled = track.scrollLeft >= maxScroll;
  }
  track.addEventListener('scroll', () => {
    updateArrowState();
    updateDots();
  });
  window.addEventListener('resize', () => {
    updateArrowState();
    updateDots();
  });
  updateArrowState();
  updateDots();

  // BIG SCREENS (iMac etc.): grow or shrink the cards until the page is
  // exactly one screen tall, so the gap under the dots matches the 56px
  // gap above the Back link. Laptops and phones keep the CSS sizing.
  const items = Array.from(track.querySelectorAll('.art-item'));
  function fitToScreen(){
    items.forEach(it => it.style.removeProperty('--card-w'));
    if (window.innerWidth <= 900 || window.innerHeight < 1000) return;
    const gutter = parseFloat(getComputedStyle(document.querySelector('.page-header')).paddingLeft) || 0;
    const maxW = Math.min(window.innerWidth * 0.64, window.innerWidth - gutter - 200, 1500);
    let w = items[0].getBoundingClientRect().width;
    for (let k = 0; k < 6; k++){
      const bottom = dotsWrap.getBoundingClientRect().bottom + window.scrollY + 56;
      const extra = window.innerHeight - bottom;
      if (Math.abs(extra) < 1) break;
      w = Math.max(320, Math.min(maxW, w + extra * 16 / 9));
      items.forEach(it => it.style.setProperty('--card-w', w + 'px'));
    }
    positionArrows();
    updateArrowState();
    updateDots();
  }
  fitToScreen();
  window.addEventListener('resize', fitToScreen);
  window.addEventListener('load', fitToScreen);
  if (document.fonts) document.fonts.ready.then(fitToScreen);

  // ---- zoom lightbox ----
  const lightbox = document.getElementById('lightbox');
  const lightboxStage = document.getElementById('lightboxStage');
  const lightboxImg = document.getElementById('lightboxImg');
  const lightboxClose = document.getElementById('lightboxClose');
  const zoomInBtn = document.getElementById('zoomInBtn');
  const zoomOutBtn = document.getElementById('zoomOutBtn');
  const zoomLabel = document.getElementById('zoomLabel');

  const ZOOM_MIN = 1;
  const ZOOM_MAX = 3;
  const ZOOM_STEP = 0.5;
  let zoom = 1;
  let panX = 0, panY = 0;
  let dragging = false, dragStartX = 0, dragStartY = 0, panStartX = 0, panStartY = 0;

  function applyZoom(){
    lightboxImg.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
    zoomLabel.textContent = Math.round(zoom * 100) + '%';
    zoomOutBtn.disabled = zoom <= ZOOM_MIN;
    zoomInBtn.disabled = zoom >= ZOOM_MAX;
    lightboxStage.style.cursor = zoom > 1 ? 'grab' : 'default';
  }

  function openLightbox(src, title){
    lightboxImg.src = src;
    lightboxImg.alt = title || '';
    zoom = 1; panX = 0; panY = 0;
    applyZoom();
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox(){
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
  }

  track.querySelectorAll('.zoom-trigger').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      openLightbox(btn.dataset.image, btn.dataset.title);
    });
  });

  zoomInBtn.addEventListener('click', () => {
    zoom = Math.min(ZOOM_MAX, zoom + ZOOM_STEP);
    if (zoom === ZOOM_MIN){ panX = 0; panY = 0; }
    applyZoom();
  });
  zoomOutBtn.addEventListener('click', () => {
    zoom = Math.max(ZOOM_MIN, zoom - ZOOM_STEP);
    if (zoom === ZOOM_MIN){ panX = 0; panY = 0; }
    applyZoom();
  });
  lightboxClose.addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
  });
  document.addEventListener('keydown', (e) => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === '+' || e.key === '=') zoomInBtn.click();
    if (e.key === '-') zoomOutBtn.click();
  });

  // drag to pan (mouse or one finger), pinch to zoom (two fingers),
  // double-tap / double-click to toggle 2x — works the same on phone,
  // tablet and desktop
  const pointers = new Map();
  let pinchStartDist = 0, pinchStartZoom = 1, lastTap = 0;

  function pinchDistance(){
    const [a, b] = Array.from(pointers.values());
    return Math.hypot(a.x - b.x, a.y - b.y);
  }
  function startPan(p){
    dragging = zoom > ZOOM_MIN;
    dragStartX = p.x; dragStartY = p.y;
    panStartX = panX; panStartY = panY;
    lightboxStage.classList.toggle('dragging', dragging);
  }

  lightboxStage.addEventListener('pointerdown', (e) => {
    lightboxStage.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2){
      dragging = false;
      pinchStartDist = pinchDistance();
      pinchStartZoom = zoom;
      lightboxStage.classList.add('dragging');
    } else if (pointers.size === 1){
      const now = Date.now();
      if (now - lastTap < 300){
        zoom = zoom > ZOOM_MIN ? ZOOM_MIN : 2;
        panX = 0; panY = 0;
        applyZoom();
        lastTap = 0;
        return;
      }
      lastTap = now;
      startPan(pointers.get(e.pointerId));
    }
  });
  lightboxStage.addEventListener('pointermove', (e) => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2 && pinchStartDist){
      zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, pinchStartZoom * pinchDistance() / pinchStartDist));
      if (zoom === ZOOM_MIN){ panX = 0; panY = 0; }
      lightboxImg.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
      zoomLabel.textContent = Math.round(zoom * 100) + '%';
      zoomOutBtn.disabled = zoom <= ZOOM_MIN;
      zoomInBtn.disabled = zoom >= ZOOM_MAX;
    } else if (dragging){
      panX = panStartX + (e.clientX - dragStartX);
      panY = panStartY + (e.clientY - dragStartY);
      lightboxImg.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
    }
  });
  function endPointer(e){
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinchStartDist = 0;
    if (pointers.size === 1){
      startPan(Array.from(pointers.values())[0]);   // keep panning with the remaining finger
    } else if (pointers.size === 0){
      dragging = false;
      lightboxStage.classList.remove('dragging');
      applyZoom();
    }
  }
  lightboxStage.addEventListener('pointerup', endPointer);
  lightboxStage.addEventListener('pointercancel', endPointer);

  // tapping the dark area around the image closes it (phones have no Esc key)
  lightboxStage.addEventListener('click', (e) => {
    if (e.target === lightboxStage && zoom === ZOOM_MIN) closeLightbox();
  });

  // scroll/pinch to zoom
  lightboxStage.addEventListener('wheel', (e) => {
    e.preventDefault();
    const delta = e.deltaY < 0 ? ZOOM_STEP : -ZOOM_STEP;
    zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, zoom + delta * 0.5));
    if (zoom === ZOOM_MIN){ panX = 0; panY = 0; }
    applyZoom();
  }, { passive:false });
</script>

</body>
</html>
