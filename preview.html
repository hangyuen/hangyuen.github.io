<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cosmic Dust</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040a}
canvas{position:fixed;inset:0;width:100%;height:100%}
video{position:fixed;left:-9999px;width:320px;height:240px}
#start{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;border:1px solid #ffffff44;border-radius:30px;padding:14px 22px;background:#ffffff12;color:#fff;font:14px -apple-system,BlinkMacSystemFont,sans-serif}
#status{position:fixed;top:18px;right:18px;color:#ffffff88;font:11px -apple-system,BlinkMacSystemFont,sans-serif;z-index:5}
</style>
</head>
<body>
<video id="video" autoplay muted playsinline></video>
<canvas id="canvas"></canvas>
<button id="start">Allow Camera</button>
<div id="status">camera idle</div>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const video=document.getElementById("video");
const start=document.getElementById("start");
const status=document.getElementById("status");

let W,H,DPR;
let particles=[];
let cameraOn=false;
let proximity=.15;
let targetProximity=.15;
let fieldX=.5, targetX=.5;
let prevFieldX=.5;
let wind=0;
let scanCanvas=document.createElement("canvas");
let scanCtx=scanCanvas.getContext("2d",{willReadFrequently:true});
scanCanvas.width=96;
scanCanvas.height=72;

function resize(){
  W=innerWidth; H=innerHeight; DPR=Math.min(devicePixelRatio||1,2);
  canvas.width=W*DPR; canvas.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  makeParticles();
}
function makeParticles(){
  particles=[];
  const count=Math.min(3600,Math.max(1800,Math.floor(W*H/380)));
  for(let i=0;i<count;i++){
    particles.push({
      x:Math.random()*W,y:Math.random()*H,
      vx:(Math.random()-.5)*.08,vy:(Math.random()-.5)*.08,
      s:.35+Math.random()*1.25,
      a:.08+Math.random()*.42,
      seed:Math.random()*1000
    });
  }
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

// No external libraries.
// We estimate "near/far" from frame-to-frame image energy in the center.
// This makes the page much more reliable on GitHub Pages / mobile Safari.
function analyzeCamera(){
  if(!cameraOn || video.readyState<2)return;
  try{
    scanCtx.save();
    scanCtx.scale(-1,1);
    scanCtx.drawImage(video,-96,0,96,72);
    scanCtx.restore();
    const d=scanCtx.getImageData(0,0,96,72).data;

    let total=0, weightedX=0, weight=0;
    let centerEnergy=0, edgeEnergy=0, centerN=0, edgeN=0;

    for(let y=0;y<72;y+=2){
      for(let x=0;x<96;x+=2){
        const i=(y*96+x)*4;
        const lum=(d[i]+d[i+1]+d[i+2])/3;
        const contrast=Math.abs(lum-110)+12;
        total+=lum;
        weightedX+=x*contrast;
        weight+=contrast;

        const nx=Math.abs(x-48)/48;
        const ny=Math.abs(y-36)/36;
        if(nx<.42 && ny<.55){centerEnergy+=contrast;centerN++}
        else{edgeEnergy+=contrast;edgeN++}
      }
    }

    targetX=clamp((weightedX/(weight||1))/96,.18,.82);

    // Center dominance works as a lightweight proximity proxy.
    const c=centerEnergy/(centerN||1);
    const e=edgeEnergy/(edgeN||1);
    const ratio=c/(e||1);
    targetProximity=clamp(.18+(ratio-.82)*1.15,.08,1);

    status.textContent="camera active";
  }catch(e){}
}

function frame(t){
  requestAnimationFrame(frame);
  if(cameraOn && (t|0)%3===0) analyzeCamera();

  proximity+=(targetProximity-proximity)*.035;
  fieldX+=(targetX-fieldX)*.07;
  wind+=(fieldX-prevFieldX)*2.2;
  wind*=.90;
  prevFieldX=fieldX;

  ctx.fillStyle="rgba(2,4,10,.34)";
  ctx.fillRect(0,0,W,H);

  const gx=fieldX*W, gy=H*.48;
  const radius=Math.min(W,H)*(.20+proximity*.38);

  const bg=ctx.createRadialGradient(gx,gy,0,gx,gy,radius*1.8);
  bg.addColorStop(0,`rgba(40,55,90,${.025+proximity*.055})`);
  bg.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=bg;
  ctx.fillRect(0,0,W,H);

  ctx.save();
  ctx.globalCompositeOperation="lighter";

  for(const p of particles){
    const dx=gx-p.x, dy=gy-p.y;
    const dist=Math.sqrt(dx*dx+dy*dy)+1;
    const influence=Math.max(0,1-dist/(radius*2.2));

    // Near = stronger gravity = visibly denser cloud.
    const pull=(.0015+proximity*.045)*influence*influence;
    p.vx+=dx/dist*pull;
    p.vy+=dy/dist*pull;

    // Left/right movement creates a dust current.
    p.vx+=wind*influence*.22;

    // Cosmic drift.
    p.vx+=Math.sin(t*.00018+p.seed)*.00045;
    p.vy+=Math.cos(t*.00015+p.seed*.7)*.00045;

    // Far = gentle expansion.
    if(proximity<.35){
      const ex=p.x-W/2, ey=p.y-H/2, ed=Math.sqrt(ex*ex+ey*ey)+1;
      const push=(.35-proximity)*.00045;
      p.vx+=ex/ed*push;
      p.vy+=ey/ed*push;
    }

    p.vx*=.994; p.vy*=.994;
    p.x+=p.vx; p.y+=p.vy;

    if(p.x<-10)p.x=W+10;if(p.x>W+10)p.x=-10;
    if(p.y<-10)p.y=H+10;if(p.y>H+10)p.y=-10;

    const alpha=p.a*(.42+proximity*1.55);
    const size=p.s*(.72+proximity*.52);
    ctx.beginPath();
    ctx.arc(p.x,p.y,size,0,Math.PI*2);
    ctx.fillStyle=`rgba(205,220,245,${Math.min(alpha,.8)})`;
    ctx.fill();
  }
  ctx.restore();
}

start.onclick=async()=>{
  status.textContent="requesting camera…";
  try{
    const stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:"user"},audio:false
    });
    video.srcObject=stream;
    await video.play();
    cameraOn=true;
    start.remove();
    status.textContent="camera active";
  }catch(e){
    status.textContent="camera blocked";
    start.textContent="Retry Camera";
    alert("Camera could not start. Please allow camera access in your browser settings.");
  }
};

resize();
addEventListener("resize",resize);
requestAnimationFrame(frame);
</script>
</body>
</html>
