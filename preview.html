<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cosmic Dust Presence</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #03050a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #video {
      position: fixed;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    #hud {
      position: fixed;
      left: 22px;
      bottom: 20px;
      color: rgba(255,255,255,.62);
      font-size: 12px;
      letter-spacing: .08em;
      line-height: 1.55;
      pointer-events: none;
      user-select: none;
      mix-blend-mode: screen;
    }

    #status {
      position: fixed;
      top: 18px;
      right: 20px;
      color: rgba(255,255,255,.55);
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      pointer-events: none;
    }

    #start {
      position: fixed;
      inset: 0;
      margin: auto;
      width: max-content;
      height: max-content;
      padding: 13px 18px;
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 999px;
      background: rgba(255,255,255,.06);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: white;
      font-size: 14px;
      letter-spacing: .02em;
      cursor: pointer;
    }

    #start:hover {
      background: rgba(255,255,255,.1);
    }
  </style>
</head>
<body>
  <video id="video" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>

  <div id="status">camera idle</div>
  <div id="hud">
    move closer → gravity increases<br>
    move away → dust expands
  </div>

  <button id="start">Enter the Field</button>

  <script type="module">
    import {
      FaceLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22";

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d", { alpha: false });
    const video = document.getElementById("video");
    const startBtn = document.getElementById("start");
    const statusEl = document.getElementById("status");

    let W = innerWidth, H = innerHeight, DPR = Math.min(devicePixelRatio || 1, 2);
    let faceLandmarker = null;
    let running = false;
    let lastVideoTime = -1;

    // Presence state
    const presence = {
      detected: false,
      x: 0.5,
      y: 0.5,
      proximity: 0,
      targetProximity: 0,
      vx: 0,
      vy: 0,
      energy: 0,
      lastX: 0.5,
      lastY: 0.5
    };

    function resize() {
      W = innerWidth;
      H = innerHeight;
      DPR = Math.min(devicePixelRatio || 1, 2);
      canvas.width = Math.floor(W * DPR);
      canvas.height = Math.floor(H * DPR);
      canvas.style.width = W + "px";
      canvas.style.height = H + "px";
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      createParticles();
    }

    // -----------------------
    // Particle system
    // -----------------------
    const particles = [];
    let particleCount = 2600;

    function rand(a, b) {
      return a + Math.random() * (b - a);
    }

    function createParticles() {
      particles.length = 0;
      particleCount = Math.round(Math.min(3400, Math.max(1800, W * H / 420)));

      for (let i = 0; i < particleCount; i++) {
        particles.push({
          x: Math.random() * W,
          y: Math.random() * H,
          vx: rand(-0.06, 0.06),
          vy: rand(-0.06, 0.06),
          size: Math.random() < 0.9 ? rand(0.35, 1.1) : rand(1.2, 2.2),
          alpha: rand(0.05, 0.42),
          seed: Math.random() * 1000,
          depth: rand(0.2, 1),
          orbit: rand(-1, 1),
          twinkle: rand(0.25, 1.2)
        });
      }
    }

    function softClamp(v, min, max) {
      return Math.max(min, Math.min(max, v));
    }

    function drawBackground(t) {
      const g = ctx.createRadialGradient(
        W * (0.5 + (presence.x - 0.5) * 0.08),
        H * (0.48 + (presence.y - 0.5) * 0.05),
        0,
        W * 0.5,
        H * 0.5,
        Math.max(W, H) * 0.75
      );

      const glow = 0.018 + presence.proximity * 0.032;
      g.addColorStop(0, `rgba(18,24,40,${0.9 + glow})`);
      g.addColorStop(0.45, "rgba(7,10,18,1)");
      g.addColorStop(1, "rgba(2,4,8,1)");

      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      // very faint cosmic haze
      ctx.save();
      ctx.globalCompositeOperation = "screen";
      for (let i = 0; i < 3; i++) {
        const px = W * (0.25 + i * 0.26) + Math.sin(t * 0.00008 + i) * 80;
        const py = H * (0.3 + i * 0.13);
        const rg = ctx.createRadialGradient(px, py, 0, px, py, Math.min(W, H) * 0.25);
        rg.addColorStop(0, `rgba(120,150,210,${0.006 + presence.proximity * 0.007})`);
        rg.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = rg;
        ctx.fillRect(0, 0, W, H);
      }
      ctx.restore();
    }

    function updateParticles(t) {
      const cx = presence.x * W;
      const cy = presence.y * H;

      const prox = presence.proximity;
      const fieldRadius = Math.min(W, H) * (0.22 + prox * 0.28);
      const gravity = 0.002 + prox * 0.032;
      const windX = presence.vx * W * 0.0036;
      const windY = presence.vy * H * 0.0026;

      ctx.save();
      ctx.globalCompositeOperation = "lighter";

      for (const p of particles) {
        // low-frequency drifting
        const n1 = Math.sin(t * 0.00022 + p.seed) + Math.cos(t * 0.00015 + p.seed * 0.37);
        const n2 = Math.cos(t * 0.00019 + p.seed * 1.7) - Math.sin(t * 0.00012 + p.seed * 0.53);

        p.vx += n1 * 0.0008 * p.depth;
        p.vy += n2 * 0.0008 * p.depth;

        if (presence.detected || presence.energy > 0.01) {
          const dx = cx - p.x;
          const dy = cy - p.y;
          const d2 = dx * dx + dy * dy;
          const d = Math.sqrt(d2) + 0.0001;

          // Attraction: stronger when near camera
          if (d < fieldRadius * 2.4) {
            const falloff = 1 - softClamp(d / (fieldRadius * 2.4), 0, 1);
            const pull = gravity * falloff * falloff * p.depth;

            p.vx += (dx / d) * pull;
            p.vy += (dy / d) * pull;

            // subtle swirl
            const swirl = 0.003 * prox * falloff * p.orbit;
            p.vx += (-dy / d) * swirl;
            p.vy += ( dx / d) * swirl;

            // movement causes cosmic disturbance
            p.vx += windX * falloff * p.depth;
            p.vy += windY * falloff * p.depth;
          }
        }

        // When user is far, universe "expands" softly away from center
        const ex = p.x - W * 0.5;
        const ey = p.y - H * 0.5;
        const ed = Math.sqrt(ex * ex + ey * ey) + 1;
        const expansion = (1 - prox) * 0.000018;
        p.vx += (ex / ed) * expansion;
        p.vy += (ey / ed) * expansion;

        // friction
        p.vx *= 0.992;
        p.vy *= 0.992;

        p.x += p.vx;
        p.y += p.vy;

        // wrap particles around edges
        if (p.x < -8) p.x = W + 8;
        if (p.x > W + 8) p.x = -8;
        if (p.y < -8) p.y = H + 8;
        if (p.y > H + 8) p.y = -8;

        // brightness / density illusion increases with proximity
        const tw = 0.74 + Math.sin(t * 0.001 * p.twinkle + p.seed) * 0.26;
        const localAlpha = p.alpha * (0.45 + prox * 1.6) * tw * (0.35 + presence.energy * 0.65);
        const localSize = p.size * (0.72 + prox * 0.7);

        ctx.beginPath();
        ctx.arc(p.x, p.y, localSize, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(205,220,245,${softClamp(localAlpha, 0, 0.78)})`;
        ctx.fill();

        // tiny halo on larger particles
        if (p.size > 1.45 && prox > 0.25) {
          ctx.beginPath();
          ctx.arc(p.x, p.y, localSize * 3.2, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(120,155,220,${localAlpha * 0.05})`;
          ctx.fill();
        }
      }

      ctx.restore();
    }

    function animate(t) {
      requestAnimationFrame(animate);

      // smooth presence
      presence.proximity += (presence.targetProximity - presence.proximity) * 0.055;
      const targetEnergy = presence.detected ? 1 : 0.08;
      presence.energy += (targetEnergy - presence.energy) * (presence.detected ? 0.035 : 0.012);

      // decay movement
      presence.vx *= 0.9;
      presence.vy *= 0.9;

      drawBackground(t);
      updateParticles(t);

      if (running && faceLandmarker && video.readyState >= 2) {
        detectFace();
      }
    }

    // -----------------------
    // Face tracking
    // -----------------------
    async function setupFaceLandmarker() {
      statusEl.textContent = "loading vision";

      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
      );

      faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numFaces: 1,
        outputFaceBlendshapes: false,
        outputFacialTransformationMatrixes: false
      });

      statusEl.textContent = "vision ready";
    }

    function detectFace() {
      if (video.currentTime === lastVideoTime) return;
      lastVideoTime = video.currentTime;

      const now = performance.now();
      const result = faceLandmarker.detectForVideo(video, now);

      if (result.faceLandmarks && result.faceLandmarks.length > 0) {
        const lm = result.faceLandmarks[0];

        let minX = 1, maxX = 0, minY = 1, maxY = 0;
        for (const p of lm) {
          if (p.x < minX) minX = p.x;
          if (p.x > maxX) maxX = p.x;
          if (p.y < minY) minY = p.y;
          if (p.y > maxY) maxY = p.y;
        }

        // Mirror camera X for intuitive movement
        const faceX = 1 - (minX + maxX) * 0.5;
        const faceY = (minY + maxY) * 0.5;
        const faceWidth = maxX - minX;

        const dx = faceX - presence.lastX;
        const dy = faceY - presence.lastY;

        presence.vx = presence.vx * 0.45 + dx * 0.55;
        presence.vy = presence.vy * 0.45 + dy * 0.55;

        presence.x += (faceX - presence.x) * 0.28;
        presence.y += (faceY - presence.y) * 0.28;

        // Tuned for typical laptop / phone front-camera distance.
        // faceWidth ~0.12 far, ~0.45 near.
        presence.targetProximity = softClamp((faceWidth - 0.10) / 0.34, 0, 1);
        presence.detected = true;

        presence.lastX = faceX;
        presence.lastY = faceY;

        statusEl.textContent =
          `presence ${Math.round(presence.targetProximity * 100)}%`;
      } else {
        presence.detected = false;
        presence.targetProximity *= 0.97;
        statusEl.textContent = "no presence";
      }
    }

    async function startExperience() {
      startBtn.disabled = true;
      startBtn.textContent = "Requesting Camera…";

      try {
        await setupFaceLandmarker();

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user",
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.srcObject = stream;
        await video.play();

        running = true;
        startBtn.remove();
        statusEl.textContent = "camera active";
      } catch (err) {
        console.error(err);
        startBtn.disabled = false;
        startBtn.textContent = "Camera unavailable — retry";
        statusEl.textContent = "camera blocked";
      }
    }

    startBtn.addEventListener("click", startExperience);
    addEventListener("resize", resize);

    resize();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
